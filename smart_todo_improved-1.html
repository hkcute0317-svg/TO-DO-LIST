<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 할 일 관리</title>
<style>
:root{--bg:#f0f7ff;--card:#fff;--blue:#60a5fa;--blue2:#2563eb;--light:#e0f2fe;--text:#334155;--sub:#64748b;--red:#ef4444;--green:#4ade80;--border:#bae6fd;--radius:16px}
*{box-sizing:border-box}body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;padding:22px 14px;display:flex;justify-content:center;user-select:none}
.container{width:100%;max-width:620px}h1{text-align:center;color:var(--blue2);font-size:1.55rem;margin:4px 0 20px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top-tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap}
.top-btn,.memo-toggle{border:1.5px solid var(--border);background:#fff;color:#0284c7;border-radius:11px;padding:8px 12px;font-weight:700}
.memo-section,.due-alert-section,.todo-card,.todo-card-standalone{background:#fff;border-radius:var(--radius);padding:15px 18px;margin-bottom:16px;box-shadow:0 4px 16px #bae6fd40}
.memo-section{border:1.5px solid var(--border)}.memo-header{display:flex;justify-content:space-between;align-items:center}.memo-header h2{font-size:1rem;margin:0;color:#0284c7}.memo-body{margin-top:10px}.memo-section.collapsed .memo-body{display:none}
.memo-textarea{width:100%;min-height:60px;border:1px solid var(--light);background:#f8fafc;border-radius:12px;padding:10px;resize:none;outline:none;line-height:1.5}
.due-alert-section{background:#fff1f2;border:2px solid #fecdd3}.due-alert-section h2{font-size:1rem;color:#e11d48;margin:0 0 10px}
.add-btn-main{width:100%;padding:14px;background:var(--blue);color:white;border:0;border-radius:18px;font-weight:800;font-size:1rem;margin-bottom:24px;box-shadow:0 4px 14px #60a5fa55}
.category-group{margin-bottom:20px}.category-title{font-weight:800;font-size:1.08rem;padding-bottom:7px;border-bottom:2px solid var(--border);margin-bottom:12px}
.todo-card-wrapper{position:relative;margin-bottom:14px;border-radius:var(--radius);overflow:hidden;background:var(--green);box-shadow:0 4px 16px #bae6fd40}
.swipe-hint{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#fff;font-weight:800}
.todo-card{position:relative;margin:0;z-index:2;transition:transform .1s ease-out;touch-action:pan-y}
.todo-card-standalone{margin-bottom:14px}.todo-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.todo-title{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:6px;min-width:0;word-break:break-word}.todo-title span:first-child{min-width:0}
.due-date{font-size:.76rem;color:#0284c7;background:var(--light);padding:3px 7px;border-radius:10px;white-space:nowrap;font-weight:600}
.btn-action,.btn-delete{background:none;border:0;color:var(--sub);padding:4px 5px;border-radius:6px;font-size:.82rem;white-space:nowrap}.btn-action:hover{background:var(--light);color:#0284c7}.btn-delete{color:#94a3b8}.btn-delete:hover{background:#fef2f2;color:var(--red)}
.card-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}.drag-handle{border:0;background:#eff6ff;color:#64748b;border-radius:7px;padding:5px 8px;cursor:grab;font-size:1rem;touch-action:none}.drag-handle:active{cursor:grabbing}
.dragging{opacity:.45;outline:2px dashed var(--blue)}.drop-target{border-top:3px solid var(--blue)!important}
.progress-container{margin-top:12px}.progress-bar-bg{background:var(--light);height:11px;border-radius:10px;overflow:hidden}.progress-bar-fill{height:100%;background:linear-gradient(90deg,#93c5fd,#2563eb);transition:width .25s}.progress-text{text-align:right;color:var(--sub);font-size:.82rem;margin-top:5px}
.subtasks-list{margin-top:13px;border-top:1px solid #f1f5f9;padding-top:10px}.subtask-item{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:.9rem;margin-top:7px;padding:7px 8px;border-radius:8px;background:#f8fafc}.subtask-item.completed span{text-decoration:line-through;color:#94a3b8}
.item-left{display:flex;align-items:center;gap:7px;min-width:0;flex:1}.item-left span{overflow-wrap:anywhere}.nested-details{margin-top:9px;background:#f0f9ff;border:1px solid var(--border);border-radius:11px;padding:8px 10px}.nested-summary{font-weight:700;font-size:.9rem;color:#0369a1;display:flex;justify-content:space-between;align-items:center;gap:6px;list-style:none;cursor:pointer}.nested-summary::-webkit-details-marker{display:none}.nested-summary-title:before{content:'▶ ';font-size:.7rem}.nested-details[open] .nested-summary-title:before{content:'▼ '}
.nested-content{margin-top:8px;padding-left:9px;border-left:2px solid #93c5fd}.subtask-input-group,.add-edit-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.subtask-input-group input[type=text],.subtask-input-group input[type=date],.subtask-input-group select,.add-edit-row input{min-width:0;border:1.5px solid var(--border);border-radius:9px;padding:7px;background:white}.subtask-input-group input[type=text]{flex:1}.subtask-input-group button,.add-edit-row button{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:7px 10px;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0f172a66;backdrop-filter:blur(3px);justify-content:center;align-items:center;z-index:1000;padding:14px}.modal-content{background:#fff;padding:22px;border-radius:22px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 25px #0002}.modal-content.wide{max-width:540px}.modal-content h3{margin:0 0 16px}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:700;font-size:.88rem;color:#475569;margin-bottom:6px}.form-group input,.form-group select{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:#f8fafc;outline:none}.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn-secondary,.btn-primary,.btn-danger{border:0;padding:10px 14px;border-radius:10px;font-weight:700}.btn-secondary{background:#f1f5f9;color:#64748b}.btn-primary{background:var(--blue);color:#fff}.btn-danger{background:var(--red);color:#fff}
.edit-item-box{padding:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:7px}.edit-item-row{display:flex;align-items:center;gap:7px}.edit-item-row input[type=text]{flex:1;min-width:0;padding:8px;border:1px solid var(--border);border-radius:8px}.edit-section{border-top:1px solid #e2e8f0;margin-top:14px;padding-top:12px}.edit-section-title{font-weight:800;margin-bottom:8px}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calendar-header button{border:0;background:#f1f5f9;border-radius:8px;padding:7px 10px}.calendar-title{font-weight:800}.calendar-week,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.calendar-week{margin-bottom:4px}.calendar-week div{font-size:.75rem;color:var(--sub);padding:4px}.calendar-day{min-height:55px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:4px;text-align:left;overflow:hidden;cursor:pointer}.calendar-day.selected{border:2px solid var(--blue);background:#eff6ff}.calendar-day.today{background:#f0fdf4}.calendar-number{font-size:.75rem;font-weight:800}.calendar-event{font-size:.58rem;background:#dbeafe;color:#1d4ed8;padding:2px 3px;border-radius:4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.calendar-event.today-event{background:#dcfce7;color:#15803d}.calendar-event.completed{text-decoration:line-through;color:#94a3b8;background:#e2e8f0}
.calendar-detail{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0}.calendar-detail-title{font-weight:800;margin-bottom:8px}.calendar-detail-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f1f5f9}.calendar-detail-left{display:flex;align-items:center;gap:6px;min-width:0}.calendar-detail-left span{overflow-wrap:anywhere}.calendar-detail-actions{display:flex;flex-shrink:0}.calendar-close{width:100%;margin-top:14px;padding:11px;background:#334155;color:#fff;border:0;border-radius:10px;font-weight:800}
.trash-intro{font-size:.86rem;color:var(--sub);margin:-5px 0 14px}.trash-item{padding:11px 0;border-bottom:1px solid #e2e8f0}.trash-item-title{font-weight:700;overflow-wrap:anywhere}.trash-item-meta{font-size:.78rem;color:var(--sub);margin-top:4px}.trash-item-actions{display:flex;gap:5px;margin-top:7px}.empty-state{text-align:center;color:#94a3b8;padding:20px 8px;font-size:.9rem}
@media(max-width:430px){body{padding:16px 10px}.todo-card,.todo-card-standalone{padding:14px}.todo-title{font-size:.98rem}.calendar-day{min-height:48px;padding:3px}.calendar-event{font-size:.52rem}.top-tools{justify-content:stretch}.top-btn{flex:1}}
</style>
</head>
<body>
<div class="container">
<h1>📝 스마트 할 일 관리</h1>
<div class="top-tools">
<button class="top-btn" onclick="openCalendar()">📅 마감 달력</button>
<button class="top-btn" onclick="openTrash()">🗑️ 휴지통 <span id="trashCount"></span></button>
</div>
<div class="memo-section" id="memoSection">
<div class="memo-header"><h2>✏️ 빠른 메모장</h2><button class="memo-toggle" id="memoToggle" onclick="toggleMemo()">접기 ▲</button></div>
<div class="memo-body"><textarea id="quickMemo" class="memo-textarea" placeholder="자유롭게 메모를 남겨보세요... (자동 저장)"></textarea></div>
</div>
<div id="dueAlertSection" class="due-alert-section" style="display:none"><h2>🚨 마감 오늘 / 지남!</h2><div id="dueAlertList"></div></div>
<button class="add-btn-main" onclick="openTodoModal()">+ 새 할 일 추가하기</button>
<div id="todayTaskSection" class="category-group" style="display:none"><div class="category-title" style="color:#0284c7">☀️ 오늘 할 일 목록</div><div id="todayTaskList" class="sortable-list" data-category="today"></div></div>
<div id="commissionSection" class="category-group" style="display:none"><div class="category-title" style="color:#d97706">🎨 커미션 목록</div><div id="commissionList" class="sortable-list" data-category="commission"></div></div>
<div id="homeworkSection" class="category-group" style="display:none"><div class="category-title" style="color:#7e22ce">📚 숙제 목록</div><div id="homeworkList" class="sortable-list" data-category="homework"></div></div>
<div class="category-group"><div class="category-title" id="mainSectionTitle" style="color:#64748b;display:none">📋 기타 및 일반 할 일</div><div id="todoList" class="sortable-list" data-category="none"></div></div>
</div>

<div id="todoModal" class="modal"><div class="modal-content">
<h3 id="todoModalTitle">✨ 새 할 일 추가</h3>
<div class="form-group"><label>특성 분류</label><select id="todoCategory"><option value="none">일반 할 일</option><option value="today">☀️ 오늘 할 일</option><option value="commission">🎨 커미션</option><option value="homework">📚 숙제</option></select></div>
<div class="form-group"><label>표시 방식 선택</label><select id="todoType"><option value="simple">1. 일반 방식 (밀어서 완료)</option><option value="project">2. 세부목록 방식 (진행률 표시)</option></select></div>
<div class="form-group"><label>할 일 제목</label><input id="todoTitle" type="text" placeholder="할 일을 입력해주세요"></div>
<div class="form-group"><label>마감기한 (선택)</label><input id="todoDueDate" type="date"></div>
<div class="modal-btns"><button class="btn-secondary" onclick="closeModal('todoModal')">취소</button><button class="btn-primary" onclick="saveTodoFromModal()">저장</button></div>
</div></div>

<div id="subtaskEditModal" class="modal"><div class="modal-content wide">
<h3>✏️ 세부사항 수정</h3>
<div class="form-group"><label>세부사항 종류</label><select id="editSubtaskType" onchange="handleEditTypeChange()"><option value="simple">일반 항목</option><option value="list">📂 세부목록 방식</option></select></div>
<div class="form-group"><label>제목</label><input id="editSubtaskText" type="text" placeholder="세부사항 제목"></div>
<div class="form-group" id="editSubtaskDateGroup"><label>마감기한 (선택)</label><input id="editSubtaskDate" type="date"></div>
<div id="editItemsSection" class="edit-section" style="display:none"><div class="edit-section-title">📂 목록 안의 항목 <small>(드래그로 순서 변경 가능)</small></div><div id="editItems"></div><div class="add-edit-row"><input id="newEditItemText" type="text" placeholder="새 항목 입력..."><button onclick="addEditItem()">+ 추가</button></div></div>
<div class="modal-btns"><button class="btn-secondary" onclick="closeModal('subtaskEditModal')">취소</button><button class="btn-primary" onclick="saveSubtaskEdit()">수정 완료</button></div>
</div></div>

<div id="trashModal" class="modal"><div class="modal-content wide">
<h3>🗑️ 휴지통</h3><p class="trash-intro">삭제한 항목은 7일 후 자동으로 영구 삭제돼요. 복구하면 원래 목록으로 돌아갑니다.</p><div id="trashList"></div>
<div class="modal-btns"><button class="btn-secondary" onclick="closeModal('trashModal')">닫기</button><button class="btn-danger" onclick="emptyTrash()">휴지통 비우기</button></div>
</div></div>

<div id="calendarModal" class="modal"><div class="modal-content wide">
<div class="calendar-header"><button onclick="changeCalendarMonth(-1)">◀</button><div id="calendarTitle" class="calendar-title"></div><button onclick="changeCalendarMonth(1)">▶</button></div>
<div class="calendar-week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
<div id="calendarGrid" class="calendar-grid"></div><div class="calendar-detail"><div id="calendarDetailTitle" class="calendar-detail-title">날짜를 선택해주세요.</div><div id="calendarDetailList"></div></div>
<button class="calendar-close" onclick="closeModal('calendarModal')">닫기</button>
</div></div>

<script>
'use strict';
const TODO_KEY='myTodos', TRASH_KEY='myTodoTrash';
let todos=readJSON(TODO_KEY,[]), trash=readJSON(TRASH_KEY,[]);
let editingTodoId=null, editingSubtaskInfo=null, calendarDate=new Date(), selectedCalendarDate=todayString();
let dragState=null;
function readJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:fallback}catch{return fallback}}
function todayString(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function uid(){return Date.now()+Math.floor(Math.random()*100000)}
function escapeHTML(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function saveData(){localStorage.setItem(TODO_KEY,JSON.stringify(todos));localStorage.setItem(TRASH_KEY,JSON.stringify(trash));updateTrashCount()}
function updateTrashCount(){const el=document.getElementById('trashCount');if(el)el.textContent=trash.length?`(${trash.length})`:''}
function closeModal(id){document.getElementById(id).style.display='none'}
function openModal(id){document.getElementById(id).style.display='flex'}
function cleanTrash(){const cutoff=Date.now()-7*24*60*60*1000;trash=trash.filter(x=>Number(x.deletedAt||0)>cutoff);saveData()}
function checkDateChangeAndCleanup(){const today=todayString(),last=localStorage.getItem('lastVisitedDate');if(last&&last!==today){const expired=todos.filter(t=>t.category==='today');expired.forEach(t=>moveToTrash('todo',t.id));todos=todos.filter(t=>t.category!=='today');}localStorage.setItem('lastVisitedDate',today);cleanTrash();saveData()}
function moveToTrash(type,todoId,subtaskId=null,nestedId=null){
 const now=Date.now();
 if(type==='todo'){const i=todos.findIndex(t=>String(t.id)===String(todoId));if(i<0)return;const item=todos.splice(i,1)[0];trash.push({id:uid(),kind:'todo',item,deletedAt:now,originalCategory:item.category,originalIndex:i});}
 else {const todo=todos.find(t=>String(t.id)===String(todoId));if(!todo)return;
  if(type==='subtask'){const i=todo.subtasks.findIndex(s=>String(s.id)===String(subtaskId));if(i<0)return;const item=todo.subtasks.splice(i,1)[0];trash.push({id:uid(),kind:'subtask',item,deletedAt:now,parentTodoId:todo.id,originalIndex:i});}
  if(type==='nested'){const sub=todo.subtasks.find(s=>String(s.id)===String(subtaskId));if(!sub)return;sub.items=sub.items||[];const i=sub.items.findIndex(n=>String(n.id)===String(nestedId));if(i<0)return;const item=sub.items.splice(i,1)[0];trash.push({id:uid(),kind:'nested',item,deletedAt:now,parentTodoId:todo.id,parentSubtaskId:sub.id,originalIndex:i});}
 }
 saveData();render();if(document.getElementById('calendarModal').style.display==='flex')renderCalendar();if(document.getElementById('trashModal').style.display==='flex')renderTrash();
}
function openTrash(){cleanTrash();renderTrash();openModal('trashModal')}
function renderTrash(){const box=document.getElementById('trashList');if(!trash.length){box.innerHTML='<div class="empty-state">휴지통이 비어 있어요.</div>';return}
 box.innerHTML=trash.slice().sort((a,b)=>b.deletedAt-a.deletedAt).map(entry=>{const title=entry.kind==='todo'?entry.item.title:entry.item.text;const deleted=new Date(entry.deletedAt);const remain=Math.max(0,7*24*60*60*1000-(Date.now()-entry.deletedAt));const days=Math.ceil(remain/(24*60*60*1000));return `<div class="trash-item"><div class="trash-item-title">${escapeHTML(title||'(제목 없음)')}</div><div class="trash-item-meta">${entry.kind==='todo'?'할 일':entry.kind==='subtask'?'세부 항목':'목록 안의 항목'} · ${deleted.toLocaleString('ko-KR')} 삭제 · 약 ${days}일 후 영구 삭제</div><div class="trash-item-actions"><button class="btn-primary" onclick="restoreTrash('${entry.id}')">복구</button><button class="btn-delete" onclick="permanentlyDeleteTrash('${entry.id}')">영구 삭제</button></div></div>`}).join('')}
function restoreTrash(id){const i=trash.findIndex(x=>String(x.id)===String(id));if(i<0)return;const e=trash[i];
 if(e.kind==='todo'){const item=e.item;item.category=item.category||e.originalCategory||'none';const idx=Math.min(e.originalIndex??todos.length,todos.length);todos.splice(idx,0,item);}
 else {const parent=todos.find(t=>String(t.id)===String(e.parentTodoId));if(!parent){alert('원래 상위 할 일이 없어 복구할 수 없어요. 먼저 상위 할 일을 복구해 주세요.');return}
  if(e.kind==='subtask'){parent.subtasks=parent.subtasks||[];parent.subtasks.splice(Math.min(e.originalIndex??parent.subtasks.length,parent.subtasks.length),0,e.item)}
  else {const sub=(parent.subtasks||[]).find(s=>String(s.id)===String(e.parentSubtaskId));if(!sub){alert('원래 세부목록이 없어 복구할 수 없어요. 먼저 세부목록을 복구해 주세요.');return}sub.items=sub.items||[];sub.items.splice(Math.min(e.originalIndex??sub.items.length,sub.items.length),0,e.item)}
 }
 trash.splice(i,1);saveData();render();renderTrash();if(document.getElementById('calendarModal').style.display==='flex')renderCalendar()}
function permanentlyDeleteTrash(id){if(!confirm('이 항목을 영구 삭제할까요? 복구할 수 없습니다.'))return;trash=trash.filter(x=>String(x.id)!==String(id));saveData();renderTrash()}
function emptyTrash(){if(!trash.length){alert('휴지통이 비어 있어요.');return}if(!confirm('휴지통을 모두 비울까요? 복구할 수 없습니다.'))return;trash=[];saveData();renderTrash()}

const memo=document.getElementById('quickMemo');memo.value=localStorage.getItem('myQuickMemo')||'';
function resizeMemo(){memo.style.height='auto';memo.style.height=memo.scrollHeight+'px'}resizeMemo();
memo.addEventListener('input',()=>{localStorage.setItem('myQuickMemo',memo.value);resizeMemo()});
function toggleMemo(){const sec=document.getElementById('memoSection');sec.classList.toggle('collapsed');document.getElementById('memoToggle').textContent=sec.classList.contains('collapsed')?'펼치기 ▼':'접기 ▲';if(!sec.classList.contains('collapsed'))setTimeout(resizeMemo,0)}

function openTodoModal(id=null){editingTodoId=id;const t=todos.find(x=>String(x.id)===String(id));document.getElementById('todoModalTitle').textContent=t?'✏️ 할 일 수정':'✨ 새 할 일 추가';document.getElementById('todoCategory').value=t?(t.category||'none'):'none';document.getElementById('todoType').value=t?(t.type||'simple'):'simple';document.getElementById('todoTitle').value=t?t.title:'';document.getElementById('todoDueDate').value=t?(t.dueDate||''):'';handleCategoryChange();openModal('todoModal')}
function closeTodoModal(){closeModal('todoModal');editingTodoId=null}
function handleCategoryChange(){const today=document.getElementById('todoCategory').value==='today',date=document.getElementById('todoDueDate');date.disabled=today;if(today)date.value=''}
function saveTodoFromModal(){const category=document.getElementById('todoCategory').value,title=document.getElementById('todoTitle').value.trim(),type=document.getElementById('todoType').value,dueDate=document.getElementById('todoDueDate').value||null;if(!title){alert('제목을 입력해주세요.');return}
 if(editingTodoId!==null){const t=todos.find(x=>String(x.id)===String(editingTodoId));if(!t)return;t.category=category;t.type=type;t.title=title;t.dueDate=category==='today'?null:dueDate;t.subtasks=t.subtasks||[]}
 else todos.push({id:uid(),category,type,title,dueDate:category==='today'?null:dueDate,subtasks:[],order:Date.now()});
 saveData();render();closeTodoModal()}

function calculateProgress(todo){let total=0,done=0;(todo.subtasks||[]).forEach(s=>{if(s.type==='list'&&(s.items||[]).length){total+=s.items.length;done+=s.items.filter(i=>i.completed).length}else{total++;if(s.completed)done++}});return total?Math.round(done/total*100):0}
function render(){cleanTrash();const ids={today:'todayTaskList',commission:'commissionList',homework:'homeworkList',none:'todoList'};Object.values(ids).forEach(id=>document.getElementById(id).innerHTML='');let dueCount=0;const dueBox=document.getElementById('dueAlertList');dueBox.innerHTML='';const today=todayString();
 todos.forEach(t=>{if(t.dueDate&&t.dueDate<=today){const past=t.dueDate<today;const div=document.createElement('div');div.style.cssText=`font-size:.9rem;margin-bottom:6px;color:${past?'#b91c1c':'#9f1239'}`;div.innerHTML=`📌 <strong>${escapeHTML(t.title)}</strong> <span style="font-size:.8rem">(${past?'지남: ':''}${t.dueDate})</span>`;dueBox.appendChild(div);dueCount++}
 if(t.type==='project')(t.subtasks||[]).forEach(s=>{if(s.type!=='list'&&s.dueDate&&s.dueDate<=today&&!s.completed){const past=s.dueDate<today,div=document.createElement('div');div.style.cssText=`font-size:.9rem;margin-bottom:6px;color:${past?'#b91c1c':'#9f1239'}`;div.innerHTML=`📌 <strong>${escapeHTML(s.text)}</strong> <span style="font-size:.8rem">(${escapeHTML(t.title)} - ${past?'지남: ':''}${s.dueDate})</span>`;dueBox.appendChild(div);dueCount++}});
 const card=createCard(t);document.getElementById(ids[t.category]||ids.none).appendChild(card)});
 document.getElementById('dueAlertSection').style.display=dueCount?'block':'none';
 [['todayTaskSection','todayTaskList'],['commissionSection','commissionList'],['homeworkSection','homeworkList']].forEach(([sec,list])=>document.getElementById(sec).style.display=document.getElementById(list).children.length?'block':'none');
 document.getElementById('mainSectionTitle').style.display=document.getElementById('todoList').children.length?'block':'none';updateTrashCount()}
function createCard(t){const wrap=document.createElement('div');const project=t.type==='project';wrap.className=project?'todo-card-standalone':'todo-card-wrapper';wrap.dataset.todoId=t.id;
 if(!project)wrap.innerHTML=`<div class="swipe-hint">🗑️ 휴지통으로 이동</div><div class="todo-card" id="card-${t.id}">${cardHeader(t,false)}<div style="font-size:.74rem;color:#94a3b8;margin-top:7px">💡 오른쪽으로 밀면 휴지통으로 이동 (7일 후 자동 삭제)</div></div>`;
 else {const p=calculateProgress(t);wrap.innerHTML=`${cardHeader(t,true)}<div class="progress-container"><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${p}%"></div></div><div class="progress-text">진행도: <strong style="color:#2563eb">${p}%</strong></div></div><div class="subtasks-list"><div class="sortable-subtasks" data-todo-id="${t.id}"></div><div class="subtask-input-group"><select id="subType-${t.id}"><option value="simple">일반 항목</option><option value="list">📂 세부목록 방식</option></select><input id="subInput-${t.id}" type="text" placeholder="세부 항목 입력..."><input id="subDate-${t.id}" type="date"><button onclick="addSubtask(${t.id})">추가</button></div></div>`}
 if(!project){const card=wrap.querySelector('.todo-card');initSwipe(card,t.id)}
 if(project)renderSubtasksUI(t.id,wrap.querySelector('.sortable-subtasks'));return wrap}
function cardHeader(t,project){return `<div class="todo-header"><div class="todo-title"><button class="drag-handle" title="길게 누르거나 잡고 끌어 순서 변경" draggable="true" data-drag-type="todo" data-id="${t.id}">⠿</button><span>${project?'📂':'👉'} ${escapeHTML(t.title)}</span>${t.dueDate?`<span class="due-date">📅 ${t.dueDate}</span>`:''}</div><div class="card-actions"><button class="btn-action" onclick="openTodoModal(${t.id})">수정</button><button class="btn-delete" onclick="moveToTrash('todo',${t.id})">삭제</button></div></div>`}
function renderSubtasksUI(todoId,container=null){const t=todos.find(x=>String(x.id)===String(todoId));if(!t)return;const box=container||document.querySelector(`[data-todo-id="${todoId}"].sortable-subtasks`);if(!box)return;
 const openState={};box.querySelectorAll('details[data-sub-id]').forEach(d=>openState[d.dataset.subId]=d.open);
 box.innerHTML=(t.subtasks||[]).map(s=>{const isList=s.type==='list';if(isList){const items=s.items||[],done=items.filter(i=>i.completed).length,p=items.length?Math.round(done/items.length*100):0;return `<details class="nested-details" data-todo-id="${t.id}" data-subtask-id="${s.id}" data-sub-id="${s.id}" ${openState[s.id]?'open':''}><summary class="nested-summary"><span class="nested-summary-title"><button class="drag-handle" draggable="true" data-drag-type="subtask" data-todo-id="${t.id}" data-id="${s.id}" onclick="event.preventDefault();event.stopPropagation()">⠿</button> 📂 ${escapeHTML(s.text)}</span><span>${p}% <button class="btn-action" onclick="event.preventDefault();event.stopPropagation();openSubtaskEditModal(${t.id},${s.id})">수정</button><button class="btn-delete" onclick="event.preventDefault();event.stopPropagation();moveToTrash('subtask',${t.id},${s.id})">삭제</button></span></summary><div class="nested-content"><div class="sortable-nested" data-todo-id="${t.id}" data-sub-id="${s.id}">${items.map(n=>`<div class="subtask-item ${n.completed?'completed':''}" data-todo-id="${t.id}" data-sub-id="${s.id}" data-nested-id="${n.id}"><div class="item-left"><button class="drag-handle" draggable="true" data-drag-type="nested" data-todo-id="${t.id}" data-sub-id="${s.id}" data-id="${n.id}">⠿</button><input type="checkbox" ${n.completed?'checked':''} onchange="toggleNested(${t.id},${s.id},${n.id})"><span>${escapeHTML(n.text)}</span></div><button class="btn-delete" onclick="moveToTrash('nested',${t.id},${s.id},${n.id})">✕</button></div>`).join('')}</div><div class="subtask-input-group"><input type="text" id="nestedInput-${t.id}-${s.id}" placeholder="하위 세부항목 입력..."><button onclick="addNested(${t.id},${s.id})">추가</button></div></div></details>`}
 return `<div class="subtask-item ${s.completed?'completed':''}" data-todo-id="${t.id}" data-subtask-id="${s.id}"><div class="item-left"><button class="drag-handle" draggable="true" data-drag-type="subtask" data-todo-id="${t.id}" data-id="${s.id}">⠿</button><input type="checkbox" ${s.completed?'checked':''} onchange="toggleSubtask(${t.id},${s.id})"><span>${escapeHTML(s.text)}</span>${s.dueDate?`<span class="due-date">📅 ${s.dueDate}</span>`:''}</div><div class="card-actions"><button class="btn-action" onclick="openSubtaskEditModal(${t.id},${s.id})">수정</button><button class="btn-delete" onclick="moveToTrash('subtask',${t.id},${s.id})">✕</button></div></div>`}).join('');initDragHandles(box)}
function addSubtask(id){const t=todos.find(x=>String(x.id)===String(id)),input=document.getElementById(`subInput-${id}`);if(!t||!input||!input.value.trim())return;const type=document.getElementById(`subType-${id}`).value,s={id:uid(),type,text:input.value.trim(),completed:false};if(type==='list')s.items=[];else s.dueDate=document.getElementById(`subDate-${id}`).value||null;t.subtasks=t.subtasks||[];t.subtasks.push(s);input.value='';document.getElementById(`subDate-${id}`).value='';saveData();render()}
function addNested(todoId,subId){const t=todos.find(x=>String(x.id)===String(todoId)),s=t?.subtasks.find(x=>String(x.id)===String(subId)),input=document.getElementById(`nestedInput-${todoId}-${subId}`);if(!s||!input||!input.value.trim())return;s.items=s.items||[];s.items.push({id:uid(),text:input.value.trim(),completed:false});saveData();render()}
function toggleSubtask(tid,sid){const t=todos.find(x=>String(x.id)===String(tid)),s=t?.subtasks.find(x=>String(x.id)===String(sid));if(!s)return;s.completed=!s.completed;saveData();render()}
function toggleNested(tid,sid,nid){const t=todos.find(x=>String(x.id)===String(tid)),s=t?.subtasks.find(x=>String(x.id)===String(sid)),n=s?.items?.find(x=>String(x.id)===String(nid));if(!n)return;n.completed=!n.completed;saveData();render()}

function openSubtaskEditModal(tid,sid){const t=todos.find(x=>String(x.id)===String(tid)),s=t?.subtasks.find(x=>String(x.id)===String(sid));if(!s)return;editingSubtaskInfo={tid,sid};document.getElementById('editSubtaskType').value=s.type||'simple';document.getElementById('editSubtaskText').value=s.text||'';document.getElementById('editSubtaskDate').value=s.dueDate||'';renderEditItems();handleEditTypeChange();openModal('subtaskEditModal')}
function handleEditTypeChange(){const list=document.getElementById('editSubtaskType').value==='list';document.getElementById('editSubtaskDateGroup').style.display=list?'none':'block';document.getElementById('editItemsSection').style.display=list?'block':'none'}
function renderEditItems(){const {tid,sid}=editingSubtaskInfo||{};const s=todos.find(t=>String(t.id)===String(tid))?.subtasks.find(x=>String(x.id)===String(sid));const box=document.getElementById('editItems');if(!s)return;box.innerHTML=(s.items||[]).map(n=>`<div class="edit-item-box" draggable="true" data-edit-item="${n.id}"><div class="edit-item-row"><span class="drag-handle">⠿</span><input type="checkbox" ${n.completed?'checked':''} onchange="toggleEditNested(${n.id},this.checked)"><input type="text" data-edit-text="${n.id}" value="${escapeHTML(n.text)}" placeholder="항목 이름"><button class="btn-delete" onclick="deleteEditItem(${n.id})">✕</button></div></div>`).join('')||'<div class="empty-state">아직 목록 항목이 없습니다.</div>';initDragHandles(box)}
function toggleEditNested(id,checked){const {tid,sid}=editingSubtaskInfo||{};const s=todos.find(t=>String(t.id)===String(tid))?.subtasks.find(x=>String(x.id)===String(sid));const n=s?.items?.find(x=>String(x.id)===String(id));if(n){n.completed=checked;saveData()}}
function captureEditTexts(){if(!editingSubtaskInfo)return;const {tid,sid}=editingSubtaskInfo,s=todos.find(t=>String(t.id)===String(tid))?.subtasks.find(x=>String(x.id)===String(sid));if(!s)return;(s.items||[]).forEach(n=>{const el=document.querySelector(`[data-edit-text="${n.id}"]`);if(el)n.text=el.value})}
function deleteEditItem(id){captureEditTexts();const {tid,sid}=editingSubtaskInfo,s=todos.find(t=>String(t.id)===String(tid))?.subtasks.find(x=>String(x.id)===String(sid));if(!s)return;const idx=s.items.findIndex(n=>String(n.id)===String(id));if(idx<0)return;const item=s.items.splice(idx,1)[0];trash.push({id:uid(),kind:'nested',item,deletedAt:Date.now(),parentTodoId:tid,parentSubtaskId:sid,originalIndex:idx});saveData();renderEditItems()}
function addEditItem(){captureEditTexts();const input=document.getElementById('newEditItemText');if(!input.value.trim())return;const {tid,sid}=editingSubtaskInfo,s=todos.find(t=>String(t.id)===String(tid))?.subtasks.find(x=>String(x.id)===String(sid));if(!s)return;s.items=s.items||[];s.items.push({id:uid(),text:input.value.trim(),completed:false});input.value='';saveData();renderEditItems()}
function saveSubtaskEdit(){captureEditTexts();const {tid,sid}=editingSubtaskInfo||{},t=todos.find(x=>String(x.id)===String(tid)),s=t?.subtasks.find(x=>String(x.id)===String(sid));if(!s)return;const text=document.getElementById('editSubtaskText').value.trim();if(!text){alert('세부사항 제목을 입력해주세요.');return}s.text=text;s.type=document.getElementById('editSubtaskType').value;if(s.type==='list'){s.dueDate=null;s.items=s.items||[]}else{s.dueDate=document.getElementById('editSubtaskDate').value||null}saveData();closeModal('subtaskEditModal');editingSubtaskInfo=null;render()}

function initSwipe(card,id){let startX=0,delta=0,swiping=false;card.addEventListener('touchstart',e=>{if(e.target.closest('button,input,select'))return;startX=e.touches[0].clientX;delta=0;swiping=true;card.style.transition='none'},{passive:true});card.addEventListener('touchmove',e=>{if(!swiping)return;delta=e.touches[0].clientX-startX;if(delta>0)card.style.transform=`translateX(${delta}px)`},{passive:true});card.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;card.style.transition='transform .22s ease';if(delta>card.offsetWidth*.42){card.style.transform=`translateX(${card.offsetWidth+40}px)`;setTimeout(()=>moveToTrash('todo',id),180)}else card.style.transform='translateX(0)';delta=0});}
function initDragHandles(root=document){root.querySelectorAll('[draggable="true"][data-drag-type]').forEach(handle=>{if(handle.dataset.dragReady)return;handle.dataset.dragReady='1';handle.addEventListener('dragstart',e=>{const el=handle.closest('[data-todo-id],.todo-card-wrapper,.todo-card-standalone,.subtask-item,.edit-item-box');dragState={type:handle.dataset.dragType,id:handle.dataset.id,todoId:handle.dataset.todoId,subId:handle.dataset.subId,element:el};if(el)el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',handle.dataset.id)});handle.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'));dragState=null})})}
function reorderArray(arr,fromId,toId){const from=arr.findIndex(x=>String(x.id)===String(fromId)),to=arr.findIndex(x=>String(x.id)===String(toId));if(from<0||to<0||from===to)return;const [item]=arr.splice(from,1);arr.splice(to,0,item)}
document.addEventListener('dragover',e=>{if(!dragState)return;const target=e.target.closest('[data-todo-id],.todo-card-wrapper,.todo-card-standalone,.subtask-item,.edit-item-box');if(!target||target===dragState.element)return;const same=()=>{if(dragState.type==='todo')return target.dataset.todoId!==undefined||target.classList.contains('todo-card-wrapper')||target.classList.contains('todo-card-standalone');if(dragState.type==='subtask')return target.dataset.subtaskId!==undefined||target.closest('.sortable-subtasks');if(dragState.type==='nested')return target.dataset.nestedId!==undefined||target.closest('.sortable-nested');if(dragState.type==='editnested')return target.dataset.editItem!==undefined;return false};if(!same())return;e.preventDefault();target.classList.add('drop-target')});
document.addEventListener('dragleave',e=>{const t=e.target.closest('.drop-target');if(t)t.classList.remove('drop-target')});
document.addEventListener('drop',e=>{if(!dragState)return;const target=e.target.closest('[data-todo-id],.todo-card-wrapper,.todo-card-standalone,.subtask-item,.edit-item-box');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(!target||target===dragState.element)return;e.preventDefault();const d=dragState;
 if(d.type==='todo'){const targetId=target.dataset.todoId||target.querySelector('[data-drag-type="todo"]')?.dataset.id;if(targetId===undefined)return;const a=todos.findIndex(t=>String(t.id)===String(d.id)),b=todos.findIndex(t=>String(t.id)===String(targetId));if(a<0||b<0||todos[a].category!==todos[b].category)return;reorderArray(todos,d.id,targetId)}
 else if(d.type==='subtask'){const t=todos.find(x=>String(x.id)===String(d.todoId));if(!t)return;const targetId=target.dataset.subtaskId||target.querySelector('[data-drag-type="subtask"]')?.dataset.id;if(targetId===undefined)return;reorderArray(t.subtasks||[],d.id,targetId)}
 else if(d.type==='nested'){const t=todos.find(x=>String(x.id)===String(d.todoId)),s=t?.subtasks.find(x=>String(x.id)===String(d.subId));if(!s)return;const targetId=target.dataset.nestedId||target.querySelector('[data-drag-type="nested"]')?.dataset.id;if(targetId===undefined)return;reorderArray(s.items||[],d.id,targetId)}
 else if(d.type==='editnested'){const {tid,sid}=editingSubtaskInfo||{},s=todos.find(x=>String(x.id)===String(tid))?.subtasks.find(x=>String(x.id)===String(sid));if(!s)return;captureEditTexts();reorderArray(s.items||[],d.id,target.dataset.editItem);renderEditItems()}
 saveData();render();if(document.getElementById('subtaskEditModal').style.display==='flex'&&editingSubtaskInfo)renderEditItems();});
function enableEditItemDrag(){document.querySelectorAll('.edit-item-box').forEach(el=>{if(el.dataset.dragReady)return;el.dataset.dragReady='1';el.draggable=true;el.dataset.dragType='editnested';el.addEventListener('dragstart',e=>{captureEditTexts();dragState={type:'editnested',id:el.dataset.editItem,element:el};e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>{dragState=null;document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'))})})}
const oldRenderEditItems=renderEditItems;renderEditItems=function(){oldRenderEditItems();enableEditItemDrag();};
function initDragForRendered(){initDragHandles(document)}
const observer=new MutationObserver(()=>initDragForRendered());observer.observe(document.body,{childList:true,subtree:true});

function getCalendarEvents(){const out=[],today=todayString();todos.forEach(t=>{if(t.category==='today')out.push({id:String(t.id),title:t.title,date:today,type:'today',completed:!!t.completed,todoId:t.id});else if(t.dueDate)out.push({id:String(t.id),title:t.title,date:t.dueDate,type:'todo',completed:!!t.completed,todoId:t.id});if(t.type==='project')(t.subtasks||[]).forEach(s=>{if(s.type!=='list'&&s.dueDate)out.push({id:`sub-${t.id}-${s.id}`,title:s.text,date:s.dueDate,type:'subtask',completed:!!s.completed,todoId:t.id,subtaskId:s.id})})});return out}
function openCalendar(){calendarDate=new Date();selectedCalendarDate=todayString();renderCalendar();openModal('calendarModal')}
function changeCalendarMonth(delta){calendarDate.setMonth(calendarDate.getMonth()+delta);renderCalendar()}
function renderCalendar(){const grid=document.getElementById('calendarGrid'),year=calendarDate.getFullYear(),month=calendarDate.getMonth();document.getElementById('calendarTitle').textContent=`${year}년 ${month+1}월`;grid.innerHTML='';const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),events=getCalendarEvents(),today=todayString();for(let i=0;i<first;i++)grid.appendChild(document.createElement('div'));for(let d=1;d<=days;d++){const date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,cell=document.createElement('div');cell.className='calendar-day'+(date===selectedCalendarDate?' selected':'')+(date===today?' today':'');cell.innerHTML=`<div class="calendar-number">${d}</div>`;events.filter(x=>x.date===date).slice(0,3).forEach(ev=>{const b=document.createElement('div');b.className='calendar-event'+(ev.type==='today'?' today-event':'')+(ev.completed?' completed':'');b.textContent=(ev.type==='today'?'☀️ ':'')+ev.title;cell.appendChild(b)});const count=events.filter(x=>x.date===date).length;if(count>3){const more=document.createElement('div');more.style.fontSize='.58rem';more.textContent=`+${count-3}개`;cell.appendChild(more)}cell.onclick=()=>{selectedCalendarDate=date;renderCalendar()};grid.appendChild(cell)}showCalendarDetails(selectedCalendarDate)}
function showCalendarDetails(date){document.getElementById('calendarDetailTitle').textContent=`📅 ${date} 일정`;const box=document.getElementById('calendarDetailList'),events=getCalendarEvents().filter(e=>e.date===date);box.innerHTML='';if(!events.length){box.innerHTML='<div class="empty-state">이 날짜에는 마감 일정이 없습니다.</div>';return}events.forEach(e=>{const row=document.createElement('div');row.className='calendar-detail-item';row.innerHTML=`<div class="calendar-detail-left"><input type="checkbox" ${e.completed?'checked':''} onchange="toggleCalendarEvent('${e.id}')"><span style="${e.completed?'text-decoration:line-through;color:#94a3b8':''}">${e.type==='today'?'☀️ ':''}${escapeHTML(e.title)}</span></div><div class="calendar-detail-actions"><button class="btn-action" onclick="editCalendarEvent('${e.id}')">수정</button><button class="btn-delete" onclick="deleteCalendarEvent('${e.id}')">삭제</button></div>`;box.appendChild(row)})}
function findCalendarEvent(id){return getCalendarEvents().find(e=>String(e.id)===String(id))}
function toggleCalendarEvent(id){const e=findCalendarEvent(id);if(!e)return;if(e.type==='subtask'){const t=todos.find(x=>String(x.id)===String(e.todoId)),s=t?.subtasks.find(x=>String(x.id)===String(e.subtaskId));if(s)s.completed=!s.completed}else{const t=todos.find(x=>String(x.id)===String(e.todoId));if(t)t.completed=!t.completed}saveData();render();renderCalendar()}
function editCalendarEvent(id){const e=findCalendarEvent(id);if(!e)return;if(e.type==='subtask'){openSubtaskEditModal(e.todoId,e.subtaskId)}else openTodoModal(e.todoId)}
function deleteCalendarEvent(id){const e=findCalendarEvent(id);if(!e)return;if(e.type==='subtask')moveToTrash('subtask',e.todoId,e.subtaskId);else moveToTrash('todo',e.todoId);renderCalendar()}

checkDateChangeAndCleanup();render();
</script>
