    /* =====================================================
       메인 렌더링
    ===================================================== */

    function render() {

        const todoList =
            document.getElementById(
                'todoList'
            );

        const todayTaskList =
            document.getElementById(
                'todayTaskList'
            );

        const commissionList =
            document.getElementById(
                'commissionList'
            );

        const homeworkList =
            document.getElementById(
                'homeworkList'
            );

        const dueAlertList =
            document.getElementById(
                'dueAlertList'
            );


        const dueAlertSection =
            document.getElementById(
                'dueAlertSection'
            );

        const todayTaskSection =
            document.getElementById(
                'todayTaskSection'
            );

        const commissionSection =
            document.getElementById(
                'commissionSection'
            );

        const homeworkSection =
            document.getElementById(
                'homeworkSection'
            );

        const mainSectionTitle =
            document.getElementById(
                'mainSectionTitle'
            );


        const todayStr =
            getTodayString();


        todoList.innerHTML = '';

        todayTaskList.innerHTML = '';

        commissionList.innerHTML = '';

        homeworkList.innerHTML = '';

        dueAlertList.innerHTML = '';


        let alertCount = 0;

        let todayTaskCount = 0;

        let commissionCount = 0;

        let homeworkCount = 0;


        todos.forEach(todo => {

            /*
             * 메인 할 일 마감
             */

            if (
                todo.dueDate &&
                todo.dueDate <= todayStr
            ) {

                alertCount++;


                const isPast =
                    todo.dueDate < todayStr;


                const item =
                    document.createElement(
                        'div'
                    );


                item.style.fontSize =
                    '0.9rem';

                item.style.marginBottom =
                    '6px';

                item.style.color =
                    isPast
                        ? '#b91c1c'
                        : '#9f1239';


                item.innerHTML = `

                    📌

                    <strong>
                        ${escapeHTML(todo.title)}
                    </strong>

                    <span
                        style="
                            font-size:0.8rem;
                            opacity:0.85;
                        "
                    >
                        (
                        ${
                            isPast
                                ? '지남: '
                                : ''
                        }
                        ${todo.dueDate}
                        )
                    </span>

                `;


                dueAlertList.appendChild(
                    item
                );

            }


            /*
             * 세부 항목 마감
             */

            if (
                todo.type === 'project'
            ) {

                todo.subtasks.forEach(
                    sub => {

                        if (
                            sub.type !== 'list' &&
                            sub.dueDate &&
                            sub.dueDate <= todayStr &&
                            !sub.completed
                        ) {

                            alertCount++;


                            const isPast =
                                sub.dueDate <
                                todayStr;


                            const item =
                                document.createElement(
                                    'div'
                                );


                            item.style.fontSize =
                                '0.9rem';

                            item.style.marginBottom =
                                '6px';

                            item.style.color =
                                isPast
                                    ? '#b91c1c'
                                    : '#9f1239';


                            item.innerHTML = `

                                📌

                                <strong>
                                    ${escapeHTML(sub.text)}
                                </strong>

                                <span
                                    style="
                                        font-size:0.8rem;
                                        opacity:0.85;
                                    "
                                >
                                    (
                                    ${escapeHTML(todo.title)}
                                    -
                                    ${
                                        isPast
                                            ? '지남: '
                                            : ''
                                    }
                                    ${sub.dueDate}
                                    )
                                </span>

                            `;


                            dueAlertList.appendChild(
                                item
                            );

                        }

                    }
                );

            }


            const cardElement =
                createCardElement(todo);


            if (
                todo.category === 'today'
            ) {

                todayTaskList.appendChild(
                    cardElement
                );

                todayTaskCount++;

            }

            else if (
                todo.category === 'commission'
            ) {

                commissionList.appendChild(
                    cardElement
                );

                commissionCount++;

            }

            else if (
                todo.category === 'homework'
            ) {

                homeworkList.appendChild(
                    cardElement
                );

                homeworkCount++;

            }

            else {

                todoList.appendChild(
                    cardElement
                );

            }

        });


        dueAlertSection.style.display =
            alertCount > 0
                ? 'block'
                : 'none';


        todayTaskSection.style.display =
            todayTaskCount > 0
                ? 'block'
                : 'none';


        commissionSection.style.display =
            commissionCount > 0
                ? 'block'
                : 'none';


        homeworkSection.style.display =
            homeworkCount > 0
                ? 'block'
                : 'none';


        if (
            todayTaskCount > 0 ||
            commissionCount > 0 ||
            homeworkCount > 0
        ) {

            mainSectionTitle.style.display =
                'block';

        } else {

            mainSectionTitle.style.display =
                'none';

        }

    }


    /* =====================================================
       달력
    ===================================================== */

    let calendarDate =
        new Date();

    let selectedCalendarDate =
        null;


    function openCalendarModal() {

        /*
         * 달력을 열 때 현재 날짜가 있는 달 표시
         */

        const today =
            new Date();

        calendarDate =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                1
            );


        selectedCalendarDate =
            getTodayString();


        document.getElementById(
            'calendarModal'
        ).style.display =
            'flex';


        renderCalendar();

        showCalendarDateDetails(
            selectedCalendarDate
        );

    }


    function closeCalendarModal() {

        document.getElementById(
            'calendarModal'
        ).style.display =
            'none';

    }


    function changeCalendarMonth(
        delta
    ) {

        calendarDate.setMonth(
            calendarDate.getMonth()
            + delta
        );

        renderCalendar();

    }


    function goCalendarToday() {

        const today =
            new Date();

        calendarDate =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                1
            );

        selectedCalendarDate =
            getTodayString();

        renderCalendar();

        showCalendarDateDetails(
            selectedCalendarDate
        );

    }


    /*
     * 달력에 실제로 표시할 모든 일정
     *
     * 현재 존재하는 기능 기준:
     *
     * 1. 메인 할 일
     * 2. 프로젝트의 일반 세부항목
     *
     * 세부세부목록에는 현재 마감기한 기능이
     * 존재하지 않으므로 달력에도 넣지 않음.
     */

    function getCalendarEvents() {

        const events = [];


        todos.forEach(todo => {

            if (todo.dueDate) {

                events.push({

                    id: todo.id,

                    type: 'todo',

                    title: todo.title,

                    dueDate: todo.dueDate,

                    completed: false,

                    todoId: todo.id

                });

            }


            if (
                todo.type === 'project' &&
                Array.isArray(todo.subtasks)
            ) {

                todo.subtasks.forEach(
                    sub => {

                        if (
                            sub.type !== 'list' &&
                            sub.dueDate
                        ) {

                            events.push({

                                id:
                                    `${todo.id}-${sub.id}`,

                                type: 'subtask',

                                title:
                                    sub.text,

                                dueDate:
                                    sub.dueDate,

                                completed:
                                    !!sub.completed,

                                todoId:
                                    todo.id,

                                subtaskId:
                                    sub.id,

                                parentTitle:
                                    todo.title

                            });

                        }

                    }
                );

            }

        });


        return events;

    }


    function renderCalendar() {

        const grid =
            document.getElementById(
                'calendarGrid'
            );


        grid.innerHTML = '';


        const year =
            calendarDate.getFullYear();

        const month =
            calendarDate.getMonth();


        document.getElementById(
            'calendarMonthTitle'
        ).innerText =
            `${year}년 ${month + 1}월`;


        const weekdays =
            [
                '일',
                '월',
                '화',
                '수',
                '목',
                '금',
                '토'
            ];


        weekdays.forEach(day => {

            const el =
                document.createElement(
                    'div'
                );

            el.className =
                'calendar-weekday';

            el.innerText =
                day;

            grid.appendChild(el);

        });


        const firstDay =
            new Date(
                year,
                month,
                1
            ).getDay();


        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            const empty =
                document.createElement(
                    'div'
                );

            grid.appendChild(
                empty
            );

        }


        const events =
            getCalendarEvents();


        const todayStr =
            getTodayString();


        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dateStr =
                `${year}-${String(
                    month + 1
                ).padStart(2, '0')}-${String(
                    day
                ).padStart(2, '0')}`;


            const cell =
                document.createElement(
                    'div'
                );


            cell.className =
                'calendar-day';


            if (
                dateStr ===
                selectedCalendarDate
            ) {

                cell.classList.add(
                    'selected'
                );

            }


            if (
                dateStr ===
                todayStr
            ) {

                cell.classList.add(
                    'today'
                );

            }


            const number =
                document.createElement(
                    'div'
                );


            number.className =
                'calendar-day-number';

            number.innerText =
                day;


            cell.appendChild(
                number
            );


            const dayEvents =
                events.filter(
                    event =>
                        event.dueDate ===
                        dateStr
                );


            dayEvents
                .slice(0, 3)
                .forEach(event => {

                    const badge =
                        document.createElement(
                            'div'
                        );


                    badge.className =
                        'calendar-event';


                    if (
                        event.completed
                    ) {

                        badge.classList.add(
                            'completed'
                        );

                    } else if (
                        event.dueDate <
                        todayStr
                    ) {

                        badge.classList.add(
                            'overdue'
                        );

                    }


                    badge.innerText =
                        event.title;


                    cell.appendChild(
                        badge
                    );

                });


            if (
                dayEvents.length > 3
            ) {

                const more =
                    document.createElement(
                        'div'
                    );

                more.className =
                    'calendar-more';

                more.innerText =
                    `+${dayEvents.length - 3}개`;


                cell.appendChild(
                    more
                );

            }


            cell.onclick = () => {

                selectedCalendarDate =
                    dateStr;

                renderCalendar();

                showCalendarDateDetails(
                    dateStr
                );

            };


            grid.appendChild(
                cell
            );

        }

    }


    /* =====================================================
       날짜별 상세 일정
    ===================================================== */

    function showCalendarDateDetails(
        dateStr
    ) {

        const title =
            document.getElementById(
                'calendarDetailTitle'
            );

        const list =
            document.getElementById(
                'calendarDetailList'
            );


        title.innerText =
            `${dateStr} 마감 일정`;


        list.innerHTML = '';


        const events =
            getCalendarEvents()
                .filter(
                    event =>
                        event.dueDate ===
                        dateStr
                );


        if (
            events.length === 0
        ) {

            list.innerHTML = `

                <div class="calendar-detail-empty">
                    이 날짜에 마감인 일정이 없습니다.
                </div>

            `;

            return;

        }


        events.forEach(event => {

            const item =
                document.createElement(
                    'div'
                );


            item.className =
                'calendar-detail-item';


            const completedClass =
                event.completed
                    ? 'completed'
                    : '';


            item.innerHTML = `

                <div class="calendar-detail-main">

                    <input
                        type="checkbox"
                        ${event.completed ? 'checked' : ''}
                        onchange="
                            toggleCalendarEvent(
                                '${event.type}',
                                ${event.todoId},
                                ${event.subtaskId || 'null'}
                            )
                        "
                    >

                    <span
                        class="
                            calendar-detail-name
                            ${completedClass}
                        "
                    >
                        ${escapeHTML(event.title)}
                    </span>

                </div>


                <div class="calendar-detail-meta">

                    ${
                        event.type === 'subtask'
                            ? `📂 ${escapeHTML(event.parentTitle)}`
                            : '📋 일반 할 일'
                    }

                </div>


                <div class="calendar-detail-buttons">

                    <button
                        class="calendar-edit-btn"
                        onclick="
                            editCalendarEvent(
                                '${event.type}',
                                ${event.todoId},
                                ${event.subtaskId || 'null'}
                            )
                        "
                    >
                        수정
                    </button>


                    <button
                        class="calendar-delete-btn"
                        onclick="
                            deleteCalendarEvent(
                                '${event.type}',
                                ${event.todoId},
                                ${event.subtaskId || 'null'}
                            )
                        "
                    >
                        삭제
                    </button>

                </div>

            `;


            list.appendChild(
                item
            );

        });

    }


    /* =====================================================
       달력에서 완료 체크
    ===================================================== */

    function toggleCalendarEvent(
        type,
        todoId,
        subtaskId
    ) {

        if (type === 'todo') {

            /*
             * 일반 할 일은 원래 체크 상태를
             * 저장하는 구조가 아니므로
             * 여기서는 완료 체크를 지원하지 않음.
             *
             * 단순 방식은 원래대로
             * 오른쪽 스와이프 완료 방식.
             */

            alert(
                '일반 할 일은 원래 오른쪽으로 밀어서 완료하는 방식입니다.'
            );

            showCalendarDateDetails(
                selectedCalendarDate
            );

            return;

        }


        if (type === 'subtask') {

            const todo =
                todos.find(
                    t => t.id === todoId
                );


            if (!todo) return;


            const sub =
                todo.subtasks.find(
                    s => s.id === subtaskId
                );


            if (!sub) return;


            sub.completed =
                !sub.completed;


            saveData();

            render();

            renderCalendar();

            showCalendarDateDetails(
                selectedCalendarDate
            );

        }

    }


    /* =====================================================
       달력에서 수정
    ===================================================== */

    function editCalendarEvent(
        type,
        todoId,
        subtaskId
    ) {

        if (type === 'todo') {

            /*
             * 기존 수정 모달 그대로 사용
             */

            openModal(todoId);

            return;

        }


        if (type === 'subtask') {

            const todo =
                todos.find(
                    t => t.id === todoId
                );


            if (!todo) return;


            const sub =
                todo.subtasks.find(
                    s => s.id === subtaskId
                );


            if (!sub) return;


            const newText =
                prompt(
                    '세부항목 이름 수정:',
                    sub.text
                );


            if (
                newText === null
            ) return;


            const newDate =
                prompt(
                    '마감기한 수정 (YYYY-MM-DD):',
                    sub.dueDate || ''
                );


            if (
                newDate === null
            ) return;


            if (
                newText.trim() === ''
            ) {

                alert(
                    '이름을 입력해주세요.'
                );

                return;

            }


            sub.text =
                newText.trim();


            sub.dueDate =
                newDate.trim() || null;


            saveData();

            render();

            renderCalendar();

            showCalendarDateDetails(
                selectedCalendarDate
            );

        }

    }


    /* =====================================================
       달력에서 삭제
    ===================================================== */

    function deleteCalendarEvent(
        type,
        todoId,
        subtaskId
    ) {

        if (
            !confirm(
                '정말 이 항목을 삭제하시겠습니까?'
            )
        ) {

            return;

        }


        if (type === 'todo') {

            todos =
                todos.filter(
                    t => t.id !== todoId
                );

        }


        else if (type === 'subtask') {

            const todo =
                todos.find(
                    t => t.id === todoId
                );


            if (todo) {

                todo.subtasks =
                    todo.subtasks.filter(
                        s =>
                            s.id !==
                            subtaskId
                    );

            }

        }


        saveData();

        render();

        renderCalendar();

        showCalendarDateDetails(
            selectedCalendarDate
        );

    }


    /* =====================================================
       달력 바깥 클릭으로 닫기
    ===================================================== */

    document
        .getElementById('calendarModal')
        .addEventListener(
            'click',
            e => {

                if (
                    e.target.id ===
                    'calendarModal'
                ) {

                    closeCalendarModal();

                }

            }
        );


    document
        .getElementById('todoModal')
        .addEventListener(
            'click',
            e => {

                if (
                    e.target.id ===
                    'todoModal'
                ) {

                    closeModal();

                }

            }
        );


    document
        .getElementById('deleteModal')
        .addEventListener(
            'click',
            e => {

                if (
                    e.target.id ===
                    'deleteModal'
                ) {

                    closeDeleteModal();

                }

            }
        );


    /* =====================================================
       시작
    ===================================================== */

    render();

</script>
