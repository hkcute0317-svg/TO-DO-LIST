<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 할 일 관리</title>
    <style>
        :root {
            --bg-color: #f0f7ff;
            --card-bg: #ffffff;
            --primary-color: #60a5fa;
            --primary-hover: #3b82f6;
            --primary-light: #e0f2fe;
            --danger-color: #f87171;
            --danger-hover: #ef4444;
            --success-color: #4ade80;
            --text-color: #334155;
            --text-sub: #64748b;
            --border-radius: 16px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        /* 빠른 메모 섹션 */
        .memo-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
            border: 1.5px solid #bae6fd;
        }
        .memo-section h2 {
            margin: 0 0 10px 0;
            color: #0284c7;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .memo-textarea {
            width: 100%;
            min-height: 60px;
            border: 1px solid #e0f2fe;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text-color);
            outline: none;
            resize: none;
            overflow: hidden;
            line-height: 1.5;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .memo-textarea:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
        }

        /* 오늘 마감 섹션 */
        .today-section {
            background-color: #fff1f2;
            border: 2px solid #fecdd3;
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.08);
            animation: fadeIn 0.3s ease-in-out;
        }
        .today-section h2 {
            margin: 0 0 10px 0;
            color: #e11d48;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 특수 분류 전용 영역 */
        .category-group {
            margin-bottom: 20px;
        }
        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #bae6fd;
        }

        /* 메인 추가 버튼 */
        .add-btn-main {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            box-shadow: 0 4px 14px rgba(96, 165, 250, 0.35);
            transition: all 0.2s ease;
        }
        .add-btn-main:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.4);
        }

        /* 스와이프 가능한 할 일 카드 컨테이너 */
        .todo-card-wrapper {
            position: relative;
            margin-bottom: 16px;
            border-radius: var(--border-radius);
            overflow: hidden;
            background-color: var(--success-color);
            box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
        }

        .swipe-hint {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1;
        }

        .todo-card {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 18px 20px;
            transition: transform 0.1s ease-out;
            touch-action: pan-y;
        }

        /* 세부목록 전용 독자 카드 */
        .todo-card-standalone {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 18px 20px;
            box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
            margin-bottom: 16px;
        }

        .todo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .todo-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
        }

        .due-date {
            font-size: 0.78rem;
            color: #0284c7;
            background: var(--primary-light);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 프로그래스 바 */
        .progress-container {
            margin-top: 14px;
        }
        .progress-bar-bg {
            background-color: #e0f2fe;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #93c5fd, #3b82f6);
            height: 100%;
            width: 100%;
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-text {
            font-size: 0.85rem;
            text-align: right;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 600;
        }

        /* 서브 태스크 */
        .subtasks-list {
            margin-top: 14px;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }
        .subtask-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-top: 8px;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .subtask-item.completed span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .subtask-input-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .subtask-input-group input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            outline: none;
            font-size: 0.9rem;
        }
        .subtask-input-group input[type="date"] {
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            padding: 6px 8px;
            outline: none;
            font-size: 0.85rem;
        }
        .subtask-input-group button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 버튼류 */
        .btn-action {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            background-color: #f1f5f9;
            color: var(--text-color);
        }
        .btn-delete {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .btn-delete:hover {
            color: var(--danger-color);
            background-color: #fef2f2;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 24px;
            width: 88%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background-color: #f8fafc;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-danger {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popUp { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🩵 오늘의 할 일</h1>

    <!-- 빠른 메모 칸 -->
    <div class="memo-section">
        <h2>✏️ 빠른 메모장</h2>
        <textarea id="quickMemo" class="memo-textarea" placeholder="자유롭게 메모를 남겨보세요... (자동 저장)"></textarea>
    </div>

    <!-- 오늘 마감 섹션 -->
    <div id="todaySection" class="today-section" style="display: none;">
        <h2>🚨 오늘 마감인 할 일!</h2>
        <div id="todayList"></div>
    </div>

    <button class="add-btn-main" onclick="openModal()">+ 새 할 일 추가하기</button>

    <!-- 특수 커스텀 태그 목록 섹션들 (동적 표시) -->
    <div id="commissionSection" class="category-group" style="display: none;">
        <div class="category-title" style="color: #d97706;">🎨 커미션 목록</div>
        <div id="commissionList"></div>
    </div>

    <div id="homeworkSection" class="category-group" style="display: none;">
        <div class="category-title" style="color: #7e22ce;">📚 숙제 목록</div>
        <div id="homeworkList"></div>
    </div>

    <!-- 일반 전체 할 일 목록 -->
    <div id="mainSection" class="category-group">
        <div class="category-title" id="mainSectionTitle" style="color: #0284c7; display: none;">📋 기타 및 일반 할 일</div>
        <div id="todoList"></div>
    </div>
</div>

<!-- 추가/수정 모달 -->
<div id="todoModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">✨ 새 할 일 추가</h3>
        <div class="form-group">
            <label>특성 분류</label>
            <select id="todoCategory">
                <option value="none">일반 할 일</option>
                <option value="commission">🎨 커미션</option>
                <option value="homework">📚 숙제</option>
            </select>
        </div>
        <div class="form-group">
            <label>표시 방식 선택</label>
            <select id="todoType">
                <option value="simple">1. 일반 방식 (밀어서 완료)</option>
                <option value="project">2. 세부목록 방식 (남은 % 표시)</option>
            </select>
        </div>
        <div class="form-group">
            <label>할 일 제목</label>
            <input type="text" id="todoTitle" placeholder="할 일을 입력해주세요">
        </div>
        <div class="form-group">
            <label>마감기한 (선택)</label>
            <input type="date" id="todoDueDate">
        </div>
        <div class="modal-btns">
            <button class="btn-secondary" onclick="closeModal()">취소</button>
            <button class="btn-primary" id="saveTodoBtn" onclick="addTodo()">추가하기</button>
        </div>
    </div>
</div>

<!-- 삭제 확인 모달 -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h3>🗑️ 진짜 삭제하시겠습니까?</h3>
        <p style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 20px;">삭제된 항목은 복구할 수 없습니다.</p>
        <div class="modal-btns">
            <button class="btn-secondary" onclick="closeDeleteModal()">취소</button>
            <button class="btn-danger" id="confirmDeleteBtn">삭제하기</button>
        </div>
    </div>
</div>

<script>
    let todos = JSON.parse(localStorage.getItem('myTodos')) || [];
    let deleteTarget = null;
    let editingTodoId = null;

    // 메모장 높이 자동조절 함수
    function autoResizeMemo(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    const memoTextarea = document.getElementById('quickMemo');
    memoTextarea.value = localStorage.getItem('myQuickMemo') || '';
    autoResizeMemo(memoTextarea);

    memoTextarea.addEventListener('input', () => {
        localStorage.setItem('myQuickMemo', memoTextarea.value);
        autoResizeMemo(memoTextarea);
    });

    function saveData() {
        localStorage.setItem('myTodos', JSON.stringify(todos));
        render();
    }

    function openModal(editId = null) {
        editingTodoId = editId;
        const modalTitle = document.getElementById('modalTitle');
        const saveBtn = document.getElementById('saveTodoBtn');

        if (editId) {
            const todo = todos.find(t => t.id === editId);
            modalTitle.innerText = '✏️ 할 일 수정';
            document.getElementById('todoCategory').value = todo.category || 'none';
            document.getElementById('todoType').value = todo.type;
            document.getElementById('todoTitle').value = todo.title;
            document.getElementById('todoDueDate').value = todo.dueDate || '';
            saveBtn.innerText = '수정 완료';
            saveBtn.onclick = updateTodo;
        } else {
            modalTitle.innerText = '✨ 새 할 일 추가';
            document.getElementById('todoCategory').value = 'none';
            document.getElementById('todoType').value = 'simple';
            document.getElementById('todoTitle').value = '';
            document.getElementById('todoDueDate').value = '';
            saveBtn.innerText = '추가하기';
            saveBtn.onclick = addTodo;
        }

        document.getElementById('todoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('todoModal').style.display = 'none';
        editingTodoId = null;
    }

    function addTodo() {
        const category = document.getElementById('todoCategory').value;
        const type = document.getElementById('todoType').value;
        const title = document.getElementById('todoTitle').value.trim();
        const dueDate = document.getElementById('todoDueDate').value;

        if (!title) {
            alert('제목을 입력해주세요.');
            return;
        }

        todos.push({
            id: Date.now(),
            category,
            type, title,
            dueDate: dueDate || null,
            subtasks: []
        });

        saveData();
        closeModal();
    }

    function updateTodo() {
        const todo = todos.find(t => t.id === editingTodoId);
        if (!todo) return;

        const title = document.getElementById('todoTitle').value.trim();
        if (!title) {
            alert('제목을 입력해주세요.');
            return;
        }

        todo.category = document.getElementById('todoCategory').value;
        todo.type = document.getElementById('todoType').value;
        todo.title = title;
        todo.dueDate = document.getElementById('todoDueDate').value || null;

        saveData();
        closeModal();
    }

    function openDeleteModal(type, todoId, subtaskId = null) {
        deleteTarget = { type, todoId, subtaskId };
        document.getElementById('deleteModal').style.display = 'flex';
        document.getElementById('confirmDeleteBtn').onclick = () => {
            executeDelete();
            closeDeleteModal();
        };
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
        deleteTarget = null;
    }

    function executeDelete() {
        if (!deleteTarget) return;
        const { type, todoId, subtaskId } = deleteTarget;

        if (type === 'todo') {
            todos = todos.filter(t => t.id !== todoId);
        } else if (type === 'subtask') {
            const todo = todos.find(t => t.id === todoId);
            if (todo) todo.subtasks = todo.subtasks.filter(s => s.id !== subtaskId);
        }
        saveData();
    }

    function addSubtask(todoId) {
        const input = document.getElementById(`subInput-${todoId}`);
        const dateInput = document.getElementById(`subDate-${todoId}`);
        const text = input.value.trim();

        if (!text) return;

        const todo = todos.find(t => t.id === todoId);
        todo.subtasks.push({
            id: Date.now(),
            text,
            completed: false,
            dueDate: dateInput.value || null
        });

        saveData();
    }

    function toggleSubtask(todoId, subtaskId) {
        const todo = todos.find(t => t.id === todoId);
        const subtask = todo.subtasks.find(s => s.id === subtaskId);
        subtask.completed = !subtask.completed;
        saveData();
    }

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    function initSwipe(cardEl, id) {
        let startX = 0;
        let currentX = 0;
        let isSwiping = false;

        const onStart = (e) => {
            startX = e.touches ? e.touches[0].clientX : e.clientX;
            isSwiping = true;
            cardEl.style.transition = 'none';
        };

        const onMove = (e) => {
            if (!isSwiping) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            currentX = x - startX;

            if (currentX > 0) {
                cardEl.style.transform = `translateX(${currentX}px)`;
            }
        };

        const onEnd = () => {
            if (!isSwiping) return;
            isSwiping = false;
            cardEl.style.transition = 'transform 0.25s ease';

            if (currentX > cardEl.offsetWidth * 0.4) {
                cardEl.style.transform = `translateX(${cardEl.offsetWidth + 50}px)`;
                setTimeout(() => {
                    todos = todos.filter(t => t.id !== id);
                    saveData();
                }, 200);
            } else {
                cardEl.style.transform = `translateX(0px)`;
            }
            currentX = 0;
        };

        cardEl.addEventListener('touchstart', onStart);
        cardEl.addEventListener('touchmove', onMove);
        cardEl.addEventListener('touchend', onEnd);

        cardEl.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
    }

    function createCardElement(todo) {
        const wrapper = document.createElement('div');

        if (todo.type === 'simple') {
            wrapper.className = 'todo-card-wrapper';
            wrapper.innerHTML = `
                <div class="swipe-hint">✓ 완료됨!</div>
                <div class="todo-card" id="card-${todo.id}">
                    <div class="todo-header">
                        <div class="todo-title">
                            <span>👉 ${todo.title}</span>
                            ${todo.dueDate ? `<span class="due-date">📅 ${todo.dueDate}</span>` : ''}
                        </div>
                        <div>
                            <button class="btn-action" onclick="openModal(${todo.id})">수정</button>
                            <button class="btn-delete" onclick="openDeleteModal('todo', ${todo.id})">삭제</button>
                        </div>
                    </div>
                    <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 6px;">💡 오른쪽으로 밀어서 바로 완료</div>
                </div>
            `;

            setTimeout(() => {
                const cardEl = document.getElementById(`card-${todo.id}`);
                if (cardEl) initSwipe(cardEl, todo.id);
            }, 0);

        } else {
            wrapper.className = 'todo-card-standalone';
            const total = todo.subtasks.length;
            const completedCount = todo.subtasks.filter(s => s.completed).length;
            const remainingPercent = total === 0 ? 100 : Math.round(((total - completedCount) / total) * 100);

            let subtaskHTML = todo.subtasks.map(sub => `
                <div class="subtask-item ${sub.completed ? 'completed' : ''}">
                    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                        <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubtask(${todo.id}, ${sub.id})">
                        <span>${sub.text}</span>
                        ${sub.dueDate ? `<span class="due-date">📅 ${sub.dueDate}</span>` : ''}
                    </div>
                    <button class="btn-delete" onclick="openDeleteModal('subtask', ${todo.id}, ${sub.id})">✕</button>
                </div>
            `).join('');

            wrapper.innerHTML = `
                <div class="todo-header">
                    <div class="todo-title">
                        <span>📂 ${todo.title}</span>
                        ${todo.dueDate ? `<span class="due-date">📅 ${todo.dueDate}</span>` : ''}
                    </div>
                    <div>
                        <button class="btn-action" onclick="openModal(${todo.id})">수정</button>
                        <button class="btn-delete" onclick="openDeleteModal('todo', ${todo.id})">삭제</button>
                    </div>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${remainingPercent}%;"></div>
                    </div>
                    <div class="progress-text">남은 할 일: <strong>${remainingPercent}%</strong></div>
                </div>

                <div class="subtasks-list">
                    ${subtaskHTML}
                    <div class="subtask-input-group">
                        <input type="text" id="subInput-${todo.id}" placeholder="세부 할 일 입력...">
                        <input type="date" id="subDate-${todo.id}">
                        <button onclick="addSubtask(${todo.id})">추가</button>
                    </div>
                </div>
            `;
        }

        return wrapper;
    }

    function render() {
        const todoList = document.getElementById('todoList');
        const commissionList = document.getElementById('commissionList');
        const homeworkList = document.getElementById('homeworkList');
        const todayList = document.getElementById('todayList');

        const todaySection = document.getElementById('todaySection');
        const commissionSection = document.getElementById('commissionSection');
        const homeworkSection = document.getElementById('homeworkSection');
        const mainSectionTitle = document.getElementById('mainSectionTitle');

        const todayStr = getTodayString();

        todoList.innerHTML = '';
        commissionList.innerHTML = '';
        homeworkList.innerHTML = '';
        todayList.innerHTML = '';

        let todayCount = 0;
        let commissionCount = 0;
        let homeworkCount = 0;

        todos.forEach(todo => {
            if (todo.dueDate === todayStr) {
                todayCount++;
                const item = document.createElement('div');
                item.style.fontSize = '0.9rem';
                item.style.marginBottom = '6px';
                item.style.color = '#9f1239';
                item.innerHTML = `📌 <strong>${todo.title}</strong>`;
                todayList.appendChild(item);
            }

            if (todo.type === 'project') {
                todo.subtasks.forEach(sub => {
                    if (sub.dueDate === todayStr && !sub.completed) {
                        todayCount++;
                        const item = document.createElement('div');
                        item.style.fontSize = '0.9rem';
                        item.style.marginBottom = '6px';
                        item.style.color = '#9f1239';
                        item.innerHTML = `📌 <strong>${sub.text}</strong> (${todo.title})`;
                        todayList.appendChild(item);
                    }
                });
            }

            const cardElement = createCardElement(todo);

            if (todo.category === 'commission') {
                commissionList.appendChild(cardElement);
                commissionCount++;
            } else if (todo.category === 'homework') {
                homeworkList.appendChild(cardElement);
                homeworkCount++;
            } else {
                todoList.appendChild(cardElement);
            }
        });

        todaySection.style.display = todayCount > 0 ? 'block' : 'none';
        commissionSection.style.display = commissionCount > 0 ? 'block' : 'none';
        homeworkSection.style.display = homeworkCount > 0 ? 'block' : 'none';

        if (commissionCount > 0 || homeworkCount > 0) {
            mainSectionTitle.style.display = 'block';
        } else {
            mainSectionTitle.style.display = 'none';
        }
    }

    render();
</script>
</body>
</html>
