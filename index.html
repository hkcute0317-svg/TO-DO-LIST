<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 할 일 관리</title>
    <style>
        :root {
            --bg-color: #f0f7ff;
            --card-bg: #ffffff;
            --primary-color: #60a5fa;      /* 파스텔 블루 */
            --primary-hover: #3b82f6;      /* 조금 더 진한 블루 */
            --primary-light: #e0f2fe;      /* 연한 하늘색 배경 */
            --danger-color: #f87171;       /* 은은한 빨간색 */
            --danger-hover: #ef4444;
            --text-color: #334155;
            --text-sub: #64748b;
            --border-radius: 16px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            font-size: 1.6rem;
            margin-bottom: 24px;
        }

        /* 오늘 마감 섹션 */
        .today-section {
            background-color: #fff1f2;
            border: 2px solid #fecdd3;
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.08);
            animation: fadeIn 0.3s ease-in-out;
        }
        .today-section h2 {
            margin: 0 0 8px 0;
            color: #e11d48;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 추가 버튼 */
        .add-btn-main {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            box-shadow: 0 4px 14px rgba(96, 165, 250, 0.35);
            transition: all 0.2s ease;
        }
        .add-btn-main:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.4);
        }

        /* 할 일 카드 디자인 */
        .todo-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: slideDown 0.25s ease-out;
        }
        .todo-card:hover {
            box-shadow: 0 6px 20px rgba(147, 197, 253, 0.35);
        }

        .todo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .todo-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .due-date {
            font-size: 0.78rem;
            color: #0284c7;
            background: var(--primary-light);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 커스텀 체크박스 */
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
            border-radius: 6px;
        }

        /* 프로그래스 바 (타입 2) */
        .progress-container {
            margin-top: 14px;
        }
        .progress-bar-bg {
            background-color: #e0f2fe;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #93c5fd, #3b82f6);
            height: 100%;
            width: 100%;
            border-radius: 10px;
            /* 부드러운 길이 변화 애니메이션 */
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-text {
            font-size: 0.85rem;
            text-align: right;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 600;
        }

        /* 서브 태스크 */
        .subtasks-list {
            margin-top: 14px;
            border-top: 1px linear-gradient(to right, #f1f5f9, #e2e8f0);
            padding-top: 10px;
        }
        .subtask-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-top: 8px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: background-color 0.15s ease;
        }
        .subtask-item:hover {
            background-color: #f8fafc;
        }
        .subtask-item.completed span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .subtask-input-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .subtask-input-group input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .subtask-input-group input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        .subtask-input-group input[type="date"] {
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            padding: 6px 8px;
            outline: none;
            font-size: 0.85rem;
            color: var(--text-color);
        }
        .subtask-input-group button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .subtask-input-group button:hover {
            background: var(--primary-hover);
        }

        /* 버튼류 */
        .btn-delete {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            color: var(--danger-color);
            background-color: #fef2f2;
        }

        /* 모달 스타일 (추가 / 삭제 공통) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 24px;
            width: 88%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            color: var(--text-color);
            background-color: #f8fafc;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-danger {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }

        /* 키프레임 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popUp {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🩵 오늘의 할 일</h1>

    <!-- 오늘 마감인 할 일 섹션 -->
    <div id="todaySection" class="today-section" style="display: none;">
        <h2>🚨 오늘 마감인 할 일!</h2>
        <div id="todayList"></div>
    </div>

    <button class="add-btn-main" onclick="openModal()">+ 새 할 일 추가하기</button>

    <!-- 전체 할 일 목록 -->
    <div id="todoList"></div>
</div>

<!-- 할 일 추가 모달 -->
<div id="todoModal" class="modal">
    <div class="modal-content">
        <h3>✨ 새 할 일 추가</h3>
        <div class="form-group">
            <label>종류 선택</label>
            <select id="todoType">
                <option value="simple">1. 일반 할 일 (체크 시 자동삭제)</option>
                <option value="project">2. 세부목록 할 일 (남은 % 표시)</option>
            </select>
        </div>
        <div class="form-group">
            <label>할 일 제목</label>
            <input type="text" id="todoTitle" placeholder="할 일을 입력해주세요">
        </div>
        <div class="form-group">
            <label>마감기한 (선택)</label>
            <input type="date" id="todoDueDate">
        </div>
        <div class="modal-btns">
            <button class="btn-secondary" onclick="closeModal()">취소</button>
            <button class="btn-primary" onclick="addTodo()">추가하기</button>
        </div>
    </div>
</div>

<!-- 삭제 확인 경고 모달 -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h3>🗑️ 진짜 삭제하시겠습니까?</h3>
        <p style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 20px;" id="deleteConfirmText">삭제된 항목은 복구할 수 없습니다.</p>
        <div class="modal-btns">
            <button class="btn-secondary" onclick="closeDeleteModal()">취소</button>
            <button class="btn-danger" id="confirmDeleteBtn">삭제하기</button>
        </div>
    </div>
</div>

<script>
    let todos = JSON.parse(localStorage.getItem('myTodos')) || [];
    let deleteTarget = null; // 삭제 대상을 저장할 변수

    function saveData() {
        localStorage.setItem('myTodos', JSON.stringify(todos));
        render();
    }

    /* 새 할 일 추가 모달 */
    function openModal() {
        document.getElementById('todoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('todoModal').style.display = 'none';
        document.getElementById('todoTitle').value = '';
        document.getElementById('todoDueDate').value = '';
    }

    /* 삭제 확인 모달 */
    function openDeleteModal(type, todoId, subtaskId = null) {
        deleteTarget = { type, todoId, subtaskId };
        document.getElementById('deleteModal').style.display = 'flex';
        
        const confirmBtn = document.getElementById('confirmDeleteBtn');
        confirmBtn.onclick = function() {
            executeDelete();
            closeDeleteModal();
        };
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
        deleteTarget = null;
    }

    function executeDelete() {
        if (!deleteTarget) return;
        const { type, todoId, subtaskId } = deleteTarget;

        if (type === 'todo') {
            todos = todos.filter(t => t.id !== todoId);
        } else if (type === 'subtask') {
            const todo = todos.find(t => t.id === todoId);
            if (todo) {
                todo.subtasks = todo.subtasks.filter(s => s.id !== subtaskId);
            }
        }
        saveData();
    }

    function addTodo() {
        const type = document.getElementById('todoType').value;
        const title = document.getElementById('todoTitle').value.trim();
        const dueDate = document.getElementById('todoDueDate').value;

        if (!title) {
            alert('제목을 입력해주세요.');
            return;
        }

        const newTodo = {
            id: Date.now(),
            type: type,
            title: title,
            dueDate: dueDate || null,
            subtasks: []
        };

        todos.push(newTodo);
        saveData();
        closeModal();
    }

    /* 세부 항목 관련 기능 */
    function addSubtask(todoId) {
        const input = document.getElementById(`subInput-${todoId}`);
        const dateInput = document.getElementById(`subDate-${todoId}`);
        const text = input.value.trim();
        const dueDate = dateInput.value;

        if (!text) return;

        const todo = todos.find(t => t.id === todoId);
        todo.subtasks.push({
            id: Date.now(),
            text: text,
            completed: false,
            dueDate: dueDate || null
        });

        saveData();
    }

    function toggleSubtask(todoId, subtaskId) {
        const todo = todos.find(t => t.id === todoId);
        const subtask = todo.subtasks.find(s => s.id === subtaskId);
        subtask.completed = !subtask.completed;
        saveData();
    }

    function getTodayString() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function render() {
        const todoList = document.getElementById('todoList');
        const todayList = document.getElementById('todayList');
        const todaySection = document.getElementById('todaySection');
        const todayStr = getTodayString();

        todoList.innerHTML = '';
        todayList.innerHTML = '';
        let todayCount = 0;

        todos.forEach(todo => {
            // 오늘 마감 체크
            const isMainToday = todo.dueDate === todayStr;
            const hasSubToday = todo.type === 'project' && todo.subtasks.some(s => s.dueDate === todayStr && !s.completed);

            if (isMainToday || hasSubToday) {
                todayCount++;
                const todayCard = document.createElement('div');
                todayCard.style.fontSize = '0.9rem';
                todayCard.style.marginBottom = '6px';
                todayCard.style.color = '#9f1239';
                todayCard.innerHTML = `📌 <strong>${todo.title}</strong> ${isMainToday ? '(메인 마감)' : '(하위 항목 마감)'}`;
                todayList.appendChild(todayCard);
            }

            // 카드 UI 생성
            const card = document.createElement('div');
            card.className = 'todo-card';

            if (todo.type === 'simple') {
                // 타입 1: 일반 할 일 (체크 시 삭제)
                card.innerHTML = `
                    <div class="todo-header">
                        <div class="todo-title">
                            <input type="checkbox" onchange="executeDirectDelete(${todo.id})">
                            <span>${todo.title}</span>
                            ${todo.dueDate ? `<span class="due-date">📅 ${todo.dueDate}</span>` : ''}
                        </div>
                        <button class="btn-delete" onclick="openDeleteModal('todo', ${todo.id})">✕</button>
                    </div>
                `;
            } else {
                // 타입 2: 세부목록 할 일 (% 애니메이션)
                const total = todo.subtasks.length;
                const completedCount = todo.subtasks.filter(s => s.completed).length;
                const remainingPercent = total === 0 ? 100 : Math.round(((total - completedCount) / total) * 100);

                let subtaskHTML = todo.subtasks.map(sub => `
                    <div class="subtask-item ${sub.completed ? 'completed' : ''}">
                        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                            <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubtask(${todo.id}, ${sub.id})">
                            <span>${sub.text}</span>
                            ${sub.dueDate ? `<span class="due-date">📅 ${sub.dueDate}</span>` : ''}
                        </div>
                        <button class="btn-delete" onclick="openDeleteModal('subtask', ${todo.id}, ${sub.id})">✕</button>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="todo-header">
                        <div class="todo-title">
                            <span>📂 ${todo.title}</span>
                            ${todo.dueDate ? `<span class="due-date">📅 ${todo.dueDate}</span>` : ''}
                        </div>
                        <button class="btn-delete" onclick="openDeleteModal('todo', ${todo.id})">삭제</button>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${remainingPercent}%;"></div>
                        </div>
                        <div class="progress-text">남은 할 일: <strong>${remainingPercent}%</strong></div>
                    </div>

                    <div class="subtasks-list">
                        ${subtaskHTML}
                        <div class="subtask-input-group">
                            <input type="text" id="subInput-${todo.id}" placeholder="세부 할 일 입력...">
                            <input type="date" id="subDate-${todo.id}">
                            <button onclick="addSubtask(${todo.id})">추가</button>
                        </div>
                    </div>
                `;
            }

            todoList.appendChild(card);
        });

        todaySection.style.display = todayCount > 0 ? 'block' : 'none';
    }

    // 일반 할 일 체크박스 선택 시 바로 삭제하는 함수
    function executeDirectDelete(id) {
        todos = todos.filter(t => t.id !== id);
        saveData();
    }

    // 초기 실행
    render();
</script>
</body>
</html>
