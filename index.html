<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 할 일 관리</title>

    <style>
        :root {
            --bg-color: #f0f7ff;
            --card-bg: #ffffff;
            --primary-color: #60a5fa;
            --primary-hover: #3b82f6;
            --primary-light: #e0f2fe;
            --danger-color: #f87171;
            --danger-hover: #ef4444;
            --success-color: #4ade80;
            --text-color: #334155;
            --text-sub: #64748b;
            --border-radius: 16px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        /* =========================
           상단 제목 + 달력 버튼
        ========================= */

        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 {
            color: #2563eb;
            font-size: 1.6rem;
            margin: 0;
        }

        .calendar-open-btn {
            border: none;
            background: white;
            color: #0284c7;
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(186, 230, 253, 0.25);
        }

        .calendar-open-btn:hover {
            background: #f0f9ff;
        }

        /* 빠른 메모 */

        .memo-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
            border: 1.5px solid #bae6fd;
        }

        .memo-section h2 {
            margin: 0 0 10px 0;
            color: #0284c7;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .memo-textarea {
            width: 100%;
            min-height: 60px;
            border: 1px solid #e0f2fe;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text-color);
            outline: none;
            resize: none;
            overflow: hidden;
            line-height: 1.5;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .memo-textarea:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
        }

        /* 마감 알림 */

        .due-alert-section {
            background-color: #fff1f2;
            border: 2px solid #fecdd3;
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.08);
            animation: fadeIn 0.3s ease-in-out;
        }

        .due-alert-section h2 {
            margin: 0 0 10px 0;
            color: #e11d48;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 분류 */

        .category-group {
            margin-bottom: 20px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #bae6fd;
        }

        /* 추가 버튼 */

        .add-btn-main {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            box-shadow: 0 4px 14px rgba(96, 165, 250, 0.35);
            transition: all 0.2s ease;
        }

        .add-btn-main:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.4);
        }

        /* 스와이프 카드 */

        .todo-card-wrapper {
            position: relative;
            margin-bottom: 16px;
            border-radius: var(--border-radius);
            overflow: hidden;
            background-color: var(--success-color);
            box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
        }

        .swipe-hint {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1;
        }

        .todo-card {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 18px 20px;
            transition: transform 0.1s ease-out;
            touch-action: pan-y;
        }

        .todo-card-standalone {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 18px 20px;
            box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
            margin-bottom: 16px;
        }

        .todo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .todo-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
        }

        .due-date {
            font-size: 0.78rem;
            color: #0284c7;
            background: var(--primary-light);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 진행도 */

        .progress-container {
            margin-top: 14px;
        }

        .progress-bar-bg {
            background-color: #e0f2fe;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #93c5fd, #3b82f6);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            font-size: 0.85rem;
            text-align: right;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 600;
        }

        .percent-val {
            color: #2563eb;
            font-size: 0.95rem;
            display: inline-block;
        }

        /* 세부목록 */

        .subtasks-list {
            margin-top: 14px;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.93rem;
            margin-top: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            background-color: #f8fafc;
        }

        .subtask-item.completed span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        /* 세부목록 접기 */

        .nested-details {
            margin-top: 10px;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 8px 12px;
        }

        .nested-summary {
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            color: #0369a1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
            list-style: none;
        }

        .nested-summary::-webkit-details-marker {
            display: none;
        }

        .nested-summary-title::before {
            content: '▶ ';
            font-size: 0.75rem;
            margin-right: 6px;
            transition: transform 0.2s;
            display: inline-block;
        }

        .nested-details[open] .nested-summary-title::before {
            transform: rotate(90deg);
        }

        .nested-content {
            margin-top: 10px;
            padding-left: 10px;
            border-left: 2px solid #93c5fd;
        }

        .subtask-input-group {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .subtask-input-group select {
            padding: 6px;
            border: 1.5px solid #bae6fd;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            background: #ffffff;
        }

        .subtask-input-group input[type="text"] {
            flex: 1;
            min-width: 140px;
            padding: 6px 10px;
            border: 1.5px solid #bae6fd;
            border-radius: 10px;
            outline: none;
            font-size: 0.88rem;
        }

        .subtask-input-group input[type="date"] {
            border: 1.5px solid #bae6fd;
            border-radius: 10px;
            padding: 4px 6px;
            outline: none;
            font-size: 0.8rem;
        }

        .subtask-input-group button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* 버튼 */

        .btn-action {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .btn-action:hover {
            background-color: #e0f2fe;
            color: #0284c7;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .btn-delete:hover {
            color: var(--danger-color);
            background-color: #fef2f2;
        }

        /* 모달 */

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 24px;
            width: 88%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background-color: #f8fafc;
        }

        .form-group input:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* =========================
           달력 모달
        ========================= */

        .calendar-modal-content {
            width: 94%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: 22px;
            background: white;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .calendar-month-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #334155;
        }

        .calendar-nav {
            display: flex;
            gap: 6px;
        }

        .calendar-nav button {
            border: none;
            background: #f1f5f9;
            color: #475569;
            border-radius: 9px;
            padding: 7px 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .calendar-nav button:hover {
            background: #e0f2fe;
            color: #0284c7;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-weekday {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            padding: 5px 0;
        }

        .calendar-day {
            min-height: 68px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 5px;
            background: #fff;
            cursor: pointer;
            overflow: hidden;
        }

        .calendar-day:hover {
            background: #f8fafc;
        }

        .calendar-day.selected {
            border: 2px solid #60a5fa;
            background: #eff6ff;
        }

        .calendar-day.today {
            background: #f0fdf4;
        }

        .calendar-day-number {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .calendar-event {
            font-size: 0.62rem;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 5px;
            padding: 2px 4px;
            margin-top: 2px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .calendar-event.overdue {
            background: #fee2e2;
            color: #b91c1c;
        }

        .calendar-event.completed {
            background: #e2e8f0;
            color: #94a3b8;
            text-decoration: line-through;
        }

        .calendar-more {
            font-size: 0.6rem;
            color: #64748b;
            margin-top: 2px;
        }

        /* 날짜 상세 */

        .calendar-detail {
            margin-top: 18px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }

        .calendar-detail-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #334155;
        }

        .calendar-detail-empty {
            color: #94a3b8;
            font-size: 0.88rem;
            padding: 10px 0;
        }

        .calendar-detail-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .calendar-detail-main {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .calendar-detail-main input {
            width: 17px;
            height: 17px;
            accent-color: #3b82f6;
            flex-shrink: 0;
        }

        .calendar-detail-name {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 600;
            word-break: break-word;
        }

        .calendar-detail-name.completed {
            color: #94a3b8;
            text-decoration: line-through;
        }

        .calendar-detail-meta {
            font-size: 0.73rem;
            color: #94a3b8;
            margin-top: 5px;
            padding-left: 25px;
        }

        .calendar-detail-buttons {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            padding-left: 25px;
        }

        .calendar-detail-buttons button {
            border: none;
            border-radius: 7px;
            padding: 5px 9px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .calendar-edit-btn {
            background: #e0f2fe;
            color: #0284c7;
        }

        .calendar-delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .calendar-close-btn {
            width: 100%;
            margin-top: 15px;
            padding: 11px;
            border: none;
            border-radius: 12px;
            background: #f1f5f9;
            color: #64748b;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes popUp {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 420px) {
            .calendar-day {
                min-height: 58px;
            }

            .calendar-event {
                font-size: 0.55rem;
            }

            .calendar-detail-buttons {
                padding-left: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 제목 + 달력 버튼 -->
    <div class="top-header">
        <h1>📝 스마트 할 일 관리</h1>

        <button class="calendar-open-btn" onclick="openCalendarModal()">
            📅
        </button>
    </div>

    <!-- 빠른 메모 -->
    <div class="memo-section">
        <h2>✏️ 빠른 메모장</h2>

        <textarea
            id="quickMemo"
            class="memo-textarea"
            placeholder="자유롭게 메모를 남겨보세요... (자동 저장)"
        ></textarea>
    </div>

    <!-- 마감 알림 -->
    <div id="dueAlertSection" class="due-alert-section" style="display: none;">
        <h2>🚨 마감 오늘 / 지남!</h2>
        <div id="dueAlertList"></div>
    </div>

    <button class="add-btn-main" onclick="openModal()">
        + 새 할 일 추가하기
    </button>

    <!-- 오늘 -->
    <div id="todayTaskSection" class="category-group" style="display: none;">
        <div class="category-title" style="color: #0284c7;">
            ☀️ 오늘 할 일 목록
        </div>
        <div id="todayTaskList"></div>
    </div>

    <!-- 커미션 -->
    <div id="commissionSection" class="category-group" style="display: none;">
        <div class="category-title" style="color: #d97706;">
            🎨 커미션 목록
        </div>
        <div id="commissionList"></div>
    </div>

    <!-- 숙제 -->
    <div id="homeworkSection" class="category-group" style="display: none;">
        <div class="category-title" style="color: #7e22ce;">
            📚 숙제 목록
        </div>
        <div id="homeworkList"></div>
    </div>

    <!-- 일반 -->
    <div id="mainSection" class="category-group">
        <div
            class="category-title"
            id="mainSectionTitle"
            style="color: #64748b; display: none;"
        >
            📋 기타 및 일반 할 일
        </div>

        <div id="todoList"></div>
    </div>

</div>


<!-- =========================
     추가 / 수정 모달
========================= -->

<div id="todoModal" class="modal">

    <div class="modal-content">

        <h3 id="modalTitle">✨ 새 할 일 추가</h3>

        <div class="form-group">
            <label>특성 분류</label>

            <select id="todoCategory" onchange="handleCategoryChange()">
                <option value="none">일반 할 일</option>
                <option value="today">☀️ 오늘 할 일</option>
                <option value="commission">🎨 커미션</option>
                <option value="homework">📚 숙제</option>
            </select>
        </div>

        <div class="form-group">
            <label>표시 방식 선택</label>

            <select id="todoType">
                <option value="simple">
                    1. 일반 방식 (밀어서 완료)
                </option>

                <option value="project">
                    2. 세부목록 방식 (진행률 표시)
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>할 일 제목</label>

            <input
                type="text"
                id="todoTitle"
                placeholder="할 일을 입력해주세요"
            >
        </div>

        <div class="form-group">
            <label>마감기한 (선택)</label>

            <input type="date" id="todoDueDate">
        </div>

        <div class="modal-btns">

            <button
                class="btn-secondary"
                onclick="closeModal()"
            >
                취소
            </button>

            <button
                class="btn-primary"
                id="saveTodoBtn"
                onclick="addTodo()"
            >
                추가하기
            </button>

        </div>

    </div>
</div>


<!-- =========================
     삭제 확인 모달
========================= -->

<div id="deleteModal" class="modal">

    <div class="modal-content">

        <h3>🗑️ 진짜 삭제하시겠습니까?</h3>

        <p
            style="
                color: var(--text-sub);
                font-size: 0.95rem;
                margin-bottom: 20px;
            "
        >
            삭제된 항목은 복구할 수 없습니다.
        </p>

        <div class="modal-btns">

            <button
                class="btn-secondary"
                onclick="closeDeleteModal()"
            >
                취소
            </button>

            <button
                class="btn-danger"
                id="confirmDeleteBtn"
            >
                삭제하기
            </button>

        </div>

    </div>
</div>


<!-- =========================
     달력 모달
========================= -->

<div id="calendarModal" class="modal">

    <div class="calendar-modal-content">

        <div class="calendar-header">

            <div class="calendar-month-title" id="calendarMonthTitle">
                2026년 10월
            </div>

            <div class="calendar-nav">

                <button onclick="changeCalendarMonth(-1)">
                    ◀
                </button>

                <button onclick="goCalendarToday()">
                    오늘
                </button>

                <button onclick="changeCalendarMonth(1)">
                    ▶
                </button>

            </div>

        </div>


        <div
            id="calendarGrid"
            class="calendar-grid"
        ></div>


        <div class="calendar-detail">

            <div
                id="calendarDetailTitle"
                class="calendar-detail-title"
            >
                날짜를 선택해주세요
            </div>

            <div id="calendarDetailList"></div>

        </div>


        <button
            class="calendar-close-btn"
            onclick="closeCalendarModal()"
        >
            닫기
        </button>

    </div>

</div>


<script>

    /* =====================================================
       기존 데이터
    ===================================================== */

    let todos =
        JSON.parse(localStorage.getItem('myTodos')) || [];

    let deleteTarget = null;
    let editingTodoId = null;


    /* =====================================================
       날짜
    ===================================================== */

    function getTodayString() {

        const today = new Date();

        return `${today.getFullYear()}-${String(
            today.getMonth() + 1
        ).padStart(2, '0')}-${String(
            today.getDate()
        ).padStart(2, '0')}`;

    }


    function checkDateChangeAndCleanup() {

        const todayStr = getTodayString();

        const lastVisitedDate =
            localStorage.getItem('lastVisitedDate');

        if (
            lastVisitedDate &&
            lastVisitedDate !== todayStr
        ) {

            todos =
                todos.filter(
                    t => t.category !== 'today'
                );

            localStorage.setItem(
                'myTodos',
                JSON.stringify(todos)
            );

        }

        localStorage.setItem(
            'lastVisitedDate',
            todayStr
        );

    }


    checkDateChangeAndCleanup();


    /* =====================================================
       카테고리
    ===================================================== */

    function handleCategoryChange() {

        const category =
            document.getElementById('todoCategory').value;

        const dueDateInput =
            document.getElementById('todoDueDate');

        if (category === 'today') {

            dueDateInput.value = '';
            dueDateInput.disabled = true;

        } else {

            dueDateInput.disabled = false;

        }

    }


    /* =====================================================
       메모
    ===================================================== */

    function autoResizeMemo(el) {

        el.style.height = 'auto';

        el.style.height =
            el.scrollHeight + 'px';

    }


    const memoTextarea =
        document.getElementById('quickMemo');

    memoTextarea.value =
        localStorage.getItem('myQuickMemo') || '';

    autoResizeMemo(memoTextarea);


    memoTextarea.addEventListener(
        'input',
        () => {

            localStorage.setItem(
                'myQuickMemo',
                memoTextarea.value
            );

            autoResizeMemo(memoTextarea);

        }
    );


    /* =====================================================
       저장
    ===================================================== */

    function saveData() {

        localStorage.setItem(
            'myTodos',
            JSON.stringify(todos)
        );

    }


    /* =====================================================
       할 일 추가 / 수정
    ===================================================== */

    function openModal(editId = null) {

        editingTodoId = editId;

        const modalTitle =
            document.getElementById('modalTitle');

        const saveBtn =
            document.getElementById('saveTodoBtn');


        if (editId) {

            const todo =
                todos.find(t => t.id === editId);

            if (!todo) return;

            modalTitle.innerText =
                '✏️ 할 일 수정';

            document.getElementById(
                'todoCategory'
            ).value =
                todo.category || 'none';

            document.getElementById(
                'todoType'
            ).value =
                todo.type;

            document.getElementById(
                'todoTitle'
            ).value =
                todo.title;

            document.getElementById(
                'todoDueDate'
            ).value =
                todo.dueDate || '';

            saveBtn.innerText =
                '수정 완료';

            saveBtn.onclick =
                updateTodo;

        } else {

            modalTitle.innerText =
                '✨ 새 할 일 추가';

            document.getElementById(
                'todoCategory'
            ).value =
                'none';

            document.getElementById(
                'todoType'
            ).value =
                'simple';

            document.getElementById(
                'todoTitle'
            ).value =
                '';

            document.getElementById(
                'todoDueDate'
            ).value =
                '';

            saveBtn.innerText =
                '추가하기';

            saveBtn.onclick =
                addTodo;

        }


        handleCategoryChange();

        document.getElementById(
            'todoModal'
        ).style.display =
            'flex';

    }


    function closeModal() {

        document.getElementById(
            'todoModal'
        ).style.display =
            'none';

        editingTodoId = null;

    }


    function addTodo() {

        const category =
            document.getElementById(
                'todoCategory'
            ).value;

        const type =
            document.getElementById(
                'todoType'
            ).value;

        const title =
            document.getElementById(
                'todoTitle'
            ).value.trim();

        const dueDate =
            document.getElementById(
                'todoDueDate'
            ).value;


        if (!title) {

            alert(
                '제목을 입력해주세요.'
            );

            return;

        }


        todos.push({

            id: Date.now(),

            category,

            type,

            title,

            dueDate:
                category === 'today'
                    ? null
                    : (dueDate || null),

            subtasks: []

        });


        saveData();

        render();

        closeModal();

    }


    function updateTodo() {

        const todo =
            todos.find(
                t => t.id === editingTodoId
            );

        if (!todo) return;


        const title =
            document.getElementById(
                'todoTitle'
            ).value.trim();


        if (!title) {

            alert(
                '제목을 입력해주세요.'
            );

            return;

        }


        const category =
            document.getElementById(
                'todoCategory'
            ).value;


        todo.category =
            category;

        todo.type =
            document.getElementById(
                'todoType'
            ).value;

        todo.title =
            title;

        todo.dueDate =
            category === 'today'
                ? null
                : (
                    document.getElementById(
                        'todoDueDate'
                    ).value || null
                );


        saveData();

        render();

        closeModal();

        renderCalendar();

        if (selectedCalendarDate) {

            showCalendarDateDetails(
                selectedCalendarDate
            );

        }

    }


    /* =====================================================
       삭제
    ===================================================== */

    function openDeleteModal(
        type,
        todoId,
        subtaskId = null,
        nestedId = null
    ) {

        deleteTarget = {
            type,
            todoId,
            subtaskId,
            nestedId
        };


        document.getElementById(
            'deleteModal'
        ).style.display =
            'flex';


        document.getElementById(
            'confirmDeleteBtn'
        ).onclick = () => {

            executeDelete();

            closeDeleteModal();

        };

    }


    function closeDeleteModal() {

        document.getElementById(
            'deleteModal'
        ).style.display =
            'none';

        deleteTarget = null;

    }


    function executeDelete() {

        if (!deleteTarget) return;


        const {
            type,
            todoId,
            subtaskId,
            nestedId
        } = deleteTarget;


        if (type === 'todo') {

            todos =
                todos.filter(
                    t => t.id !== todoId
                );

            saveData();

            render();

        }


        else if (type === 'subtask') {

            const todo =
                todos.find(
                    t => t.id === todoId
                );

            if (todo) {

                todo.subtasks =
                    todo.subtasks.filter(
                        s => s.id !== subtaskId
                    );

                saveData();

                updateProgressUI(todoId);

                renderSubtasksUI(todoId);

            }

        }


        else if (type === 'nested') {

            const todo =
                todos.find(
                    t => t.id === todoId
                );

            const parentSub =
                todo
                    ? todo.subtasks.find(
                        s => s.id === subtaskId
                    )
                    : null;


            if (
                parentSub &&
                parentSub.items
            ) {

                parentSub.items =
                    parentSub.items.filter(
                        n => n.id !== nestedId
                    );

                saveData();

                updateProgressUI(todoId);

                renderSubtasksUI(todoId);

            }

        }


        renderCalendar();

        if (selectedCalendarDate) {

            showCalendarDateDetails(
                selectedCalendarDate
            );

        }

    }


    /* =====================================================
       진행률
       0% → 100%
    ===================================================== */

    function calculateTodoProgress(todo) {

        if (
            !todo ||
            !todo.subtasks ||
            todo.subtasks.length === 0
        ) {

            return 0;

        }


        let totalPoints = 0;

        let completedPoints = 0;


        todo.subtasks.forEach(sub => {

            if (sub.type === 'list') {

                const subItems =
                    sub.items || [];


                if (subItems.length === 0) {

                    totalPoints += 1;

                    if (sub.completed) {

                        completedPoints += 1;

                    }

                } else {

                    totalPoints +=
                        subItems.length;

                    completedPoints +=
                        subItems.filter(
                            i => i.completed
                        ).length;

                }

            } else {

                totalPoints += 1;

                if (sub.completed) {

                    completedPoints += 1;

                }

            }

        });


        if (totalPoints === 0) {

            return 0;

        }


        return Math.round(
            (completedPoints / totalPoints) * 100
        );

    }


    function updateProgressUI(todoId) {

        const todo =
            todos.find(
                t => t.id === todoId
            );

        if (
            !todo ||
            todo.type !== 'project'
        ) return;


        const targetPercent =
            calculateTodoProgress(todo);


        const barFill =
            document.getElementById(
                `bar-${todoId}`
            );

        const percentSpan =
            document.getElementById(
                `percent-${todoId}`
            );


        if (
            barFill &&
            percentSpan
        ) {

            const currentPercent =
                parseInt(
                    percentSpan.innerText
                ) || 0;


            barFill.style.width =
                `${targetPercent}%`;


            animatePercentage(
                percentSpan,
                currentPercent,
                targetPercent,
                450
            );

        }

    }


    function animatePercentage(
        element,
        startVal,
        endVal,
        duration = 450
    ) {

        let startTimestamp = null;


        const step = timestamp => {

            if (!startTimestamp) {

                startTimestamp =
                    timestamp;

            }


            const progress =
                Math.min(
                    (timestamp - startTimestamp)
                    / duration,
                    1
                );


            const currentVal =
                Math.floor(
                    progress *
                    (endVal - startVal)
                    +
                    startVal
                );


            element.innerText =
                currentVal;


            if (progress < 1) {

                window.requestAnimationFrame(
                    step
                );

            } else {

                element.innerText =
                    endVal;

            }

        };


        window.requestAnimationFrame(
            step
        );

    }


    /* =====================================================
       세부목록 수정
    ===================================================== */

    function editSubtaskText(
        todoId,
        subtaskId
    ) {

        const todo =
            todos.find(
                t => t.id === todoId
            );

        const subtask =
            todo
                ? todo.subtasks.find(
                    s => s.id === subtaskId
                )
                : null;


        if (!subtask) return;


        const newText =
            prompt(
                '세부목록 제목 수정:',
                subtask.text
            );


        if (
            newText !== null &&
            newText.trim() !== ''
        ) {

            subtask.text =
                newText.trim();

            saveData();

            renderSubtasksUI(
                todoId
            );

        }

    }


    function editNestedItemText(
        todoId,
        subtaskId,
        nestedId
    ) {

        const todo =
            todos.find(
                t => t.id === todoId
            );

        const subtask =
            todo
                ? todo.subtasks.find(
                    s => s.id === subtaskId
                )
                : null;


        const nestedItem =
            subtask &&
            subtask.items
                ? subtask.items.find(
                    n => n.id === nestedId
                )
                : null;


        if (!nestedItem) return;


        const newText =
            prompt(
                '하위 세부항목 수정:',
                nestedItem.text
            );


        if (
            newText !== null &&
            newText.trim() !== ''
        ) {

            nestedItem.text =
                newText.trim();

            saveData();

            renderSubtasksUI(
                todoId
            );

        }

    }


    /* =====================================================
       세부목록 UI
       중요:
       체크해도 details가 자동으로 닫히지 않도록 유지
    ===================================================== */

    function renderSubtasksUI(todoId) {

        const todo =
            todos.find(
                t => t.id === todoId
            );

        const subListEl =
            document.getElementById(
                `sublist-${todoId}`
            );


        if (
            !todo ||
            !subListEl
        ) return;


        /*
         * 현재 열려 있는 세부목록 기억
         */
        const openStates = {};

        subListEl
            .querySelectorAll(
                'details[data-sub-id]'
            )
            .forEach(details => {

                const id =
                    details.dataset.subId;

                openStates[id] =
                    details.open;

            });


        subListEl.innerHTML =
            todo.subtasks.map(sub => {

                if (sub.type === 'list') {

                    const subItems =
                        sub.items || [];

                    const total =
                        subItems.length;

                    const completed =
                        subItems.filter(
                            i => i.completed
                        ).length;


                    const subPercent =
                        total === 0
                            ? 0
                            : Math.round(
                                (completed / total)
                                * 100
                            );


                    let nestedHTML =
                        subItems.map(n => `

                            <div
                                class="subtask-item
                                ${n.completed ? 'completed' : ''}"
                            >

                                <div
                                    style="
                                        display:flex;
                                        align-items:center;
                                        gap:8px;
                                    "
                                >

                                    <input
                                        type="checkbox"
                                        ${n.completed ? 'checked' : ''}
                                        onchange="
                                            toggleNestedItem(
                                                ${todo.id},
                                                ${sub.id},
                                                ${n.id}
                                            )
                                        "
                                    >

                                    <span>
                                        ${escapeHTML(n.text)}
                                    </span>

                                </div>

                                <div>

                                    <button
                                        class="btn-action"
                                        onclick="
                                            editNestedItemText(
                                                ${todo.id},
                                                ${sub.id},
                                                ${n.id}
                                            )
                                        "
                                    >
                                        수정
                                    </button>

                                    <button
                                        class="btn-delete"
                                        onclick="
                                            openDeleteModal(
                                                'nested',
                                                ${todo.id},
                                                ${sub.id},
                                                ${n.id}
                                            )
                                        "
                                    >
                                        ✕
                                    </button>

                                </div>

                            </div>

                        `).join('');


                    return `

                        <details
                            class="nested-details"
                            data-sub-id="${sub.id}"
                            ${openStates[sub.id] ? 'open' : ''}
                        >

                            <summary class="nested-summary">

                                <span class="nested-summary-title">
                                    📂 ${escapeHTML(sub.text)}
                                </span>

                                <div
                                    style="
                                        display:flex;
                                        align-items:center;
                                        gap:6px;
                                    "
                                    onclick="event.stopPropagation();"
                                >

                                    <span
                                        style="
                                            font-size:0.85rem;
                                            color:#0284c7;
                                            margin-right:4px;
                                        "
                                    >
                                        진행도:
                                        <strong>
                                            ${subPercent}%
                                        </strong>
                                    </span>

                                    <button
                                        class="btn-action"
                                        onclick="
                                            editSubtaskText(
                                                ${todo.id},
                                                ${sub.id}
                                            )
                                        "
                                    >
                                        수정
                                    </button>

                                </div>

                            </summary>

                            <div class="nested-content">

                                ${nestedHTML}

                                <div
                                    class="subtask-input-group"
                                    style="margin-top:8px;"
                                >

                                    <input
                                        type="text"
                                        id="nestedInput-${todo.id}-${sub.id}"
                                        placeholder="하위 세부항목 입력..."
                                    >

                                    <button
                                        onclick="
                                            addNestedItem(
                                                ${todo.id},
                                                ${sub.id}
                                            )
                                        "
                                    >
                                        추가
                                    </button>

                                    <button
                                        class="btn-delete"
                                        style="margin-left:auto;"
                                        onclick="
                                            openDeleteModal(
                                                'subtask',
                                                ${todo.id},
                                                ${sub.id}
                                            )
                                        "
                                    >
                                        세부목록 삭제
                                    </button>

                                </div>

                            </div>

                        </details>

                    `;

                }


                return `

                    <div
                        class="subtask-item
                        ${sub.completed ? 'completed' : ''}"
                    >

                        <div
                            style="
                                display:flex;
                                align-items:center;
                                gap:8px;
                                flex-wrap:wrap;
                            "
                        >

                            <input
                                type="checkbox"
                                ${sub.completed ? 'checked' : ''}
                                onchange="
                                    toggleSubtask(
                                        ${todo.id},
                                        ${sub.id}
                                    )
                                "
                            >

                            <span>
                                ${escapeHTML(sub.text)}
                            </span>

                            ${
                                sub.dueDate
                                    ? `
                                        <span class="due-date">
                                            📅 ${sub.dueDate}
                                        </span>
                                      `
                                    : ''
                            }

                        </div>

                        <div>

                            <button
                                class="btn-action"
                                onclick="
                                    editSubtaskText(
                                        ${todo.id},
                                        ${sub.id}
                                    )
                                "
                            >
                                수정
                            </button>

                            <button
                                class="btn-delete"
                                onclick="
                                    openDeleteModal(
                                        'subtask',
                                        ${todo.id},
                                        ${sub.id}
                                    )
                                "
                            >
                                ✕
                            </button>

                        </div>

                    </div>

                `;

            }).join('');

    }


    /* =====================================================
       HTML 안전 처리
    ===================================================== */

    function escapeHTML(text) {

        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    /* =====================================================
       세부목록 추가
    ===================================================== */

    function addSubtask(todoId) {

        const typeSelect =
            document.getElementById(
                `subType-${todoId}`
            );

        const input =
            document.getElementById(
                `subInput-${todoId}`
            );

        const dateInput =
            document.getElementById(
                `subDate-${todoId}`
            );


        const subType =
            typeSelect
                ? typeSelect.value
                : 'simple';


        const text =
            input.value.trim();


        if (!text) return;


        const todo =
            todos.find(
                t => t.id === todoId
            );


        if (!todo) return;


        if (subType === 'list') {

            todo.subtasks.push({

                id: Date.now(),

                type: 'list',

                text,

                items: []

            });

        } else {

            todo.subtasks.push({

                id: Date.now(),

                type: 'simple',

                text,

                completed: false,

                dueDate:
                    dateInput
                        ? (
                            dateInput.value
                            || null
                        )
                        : null

            });

        }


        saveData();

        input.value = '';

        if (dateInput) {

            dateInput.value = '';

        }


        updateProgressUI(todoId);

        renderSubtasksUI(todoId);

    }


    /* =====================================================
       세부세부목록 추가
    ===================================================== */

    function addNestedItem(
        todoId,
        subtaskId
    ) {

        const input =
            document.getElementById(
                `nestedInput-${todoId}-${subtaskId}`
            );


        const text =
            input.value.trim();


        if (!text) return;


        const todo =
            todos.find(
                t => t.id === todoId
            );


        if (!todo) return;


        const subtask =
            todo.subtasks.find(
                s => s.id === subtaskId
            );


        if (!subtask) return;


        if (!subtask.items) {

            subtask.items = [];

        }


        subtask.items.push({

            id: Date.now(),

            text,

            completed: false

        });


        saveData();

        input.value = '';


        /*
         * 세부세부목록을 추가해도
         * 현재 열려 있던 details를 유지
         */

        updateProgressUI(todoId);

        renderSubtasksUI(todoId);

    }


    /* =====================================================
       체크
    ===================================================== */

    function toggleSubtask(
        todoId,
        subtaskId
    ) {

        const todo =
            todos.find(
                t => t.id === todoId
            );


        if (!todo) return;


        const subtask =
            todo.subtasks.find(
                s => s.id === subtaskId
            );


        if (!subtask) return;


        subtask.completed =
            !subtask.completed;


        saveData();

        updateProgressUI(todoId);

        renderSubtasksUI(todoId);

        renderCalendar();

        if (selectedCalendarDate) {

            showCalendarDateDetails(
                selectedCalendarDate
            );

        }

    }


    function toggleNestedItem(
        todoId,
        subtaskId,
        nestedId
    ) {

        const todo =
            todos.find(
                t => t.id === todoId
            );


        if (!todo) return;


        const subtask =
            todo.subtasks.find(
                s => s.id === subtaskId
            );


        if (
            !subtask ||
            !subtask.items
        ) return;


        const nestedItem =
            subtask.items.find(
                i => i.id === nestedId
            );


        if (!nestedItem) return;


        nestedItem.completed =
            !nestedItem.completed;


        saveData();

        updateProgressUI(todoId);

        /*
         * details의 open 상태를
         * renderSubtasksUI 내부에서 기억하기 때문에
         * 체크해도 자동으로 접히지 않음
         */

        renderSubtasksUI(todoId);

        renderCalendar();

        if (selectedCalendarDate) {

            showCalendarDateDetails(
                selectedCalendarDate
            );

        }

    }


    function handleSubTypeChange(todoId) {

        const typeSelect =
            document.getElementById(
                `subType-${todoId}`
            );

        const dateInput =
            document.getElementById(
                `subDate-${todoId}`
            );


        if (
            typeSelect &&
            dateInput
        ) {

            if (
                typeSelect.value === 'list'
            ) {

                dateInput.style.display =
                    'none';

            } else {

                dateInput.style.display =
                    'inline-block';

            }

        }

    }


    /* =====================================================
       스와이프
    ===================================================== */

    function initSwipe(
        cardEl,
        id
    ) {

        let startX = 0;
        let currentX = 0;
        let isSwiping = false;


        const onStart = e => {

            startX =
                e.touches
                    ? e.touches[0].clientX
                    : e.clientX;

            isSwiping = true;

            cardEl.style.transition =
                'none';

        };


        const onMove = e => {

            if (!isSwiping) return;


            const x =
                e.touches
                    ? e.touches[0].clientX
                    : e.clientX;


            currentX =
                x - startX;


            if (currentX > 0) {

                cardEl.style.transform =
                    `translateX(${currentX}px)`;

            }

        };


        const onEnd = () => {

            if (!isSwiping) return;


            isSwiping = false;

            cardEl.style.transition =
                'transform 0.25s ease';


            if (
                currentX >
                cardEl.offsetWidth * 0.4
            ) {

                cardEl.style.transform =
                    `translateX(${cardEl.offsetWidth + 50}px)`;


                setTimeout(() => {

                    todos =
                        todos.filter(
                            t => t.id !== id
                        );

                    saveData();

                    render();

                    renderCalendar();

                }, 200);

            } else {

                cardEl.style.transform =
                    'translateX(0px)';

            }


            currentX = 0;

        };


        cardEl.addEventListener(
            'touchstart',
            onStart
        );

        cardEl.addEventListener(
            'touchmove',
            onMove
        );

        cardEl.addEventListener(
            'touchend',
            onEnd
        );


        cardEl.addEventListener(
            'mousedown',
            onStart
        );

        window.addEventListener(
            'mousemove',
            onMove
        );

        window.addEventListener(
            'mouseup',
            onEnd
        );

    }


    /* =====================================================
       카드 생성
    ===================================================== */

                </div>

                                👉 ${escapeHTML(todo.title)}

                            ${

                                        <span class="due-date">
                                            📅 ${todo.dueDate}

                                      `
