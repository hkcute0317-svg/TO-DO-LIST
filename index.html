
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 스크랩 다이어리</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap');

:root {
  --paper: #fffaf0;
  --paper-dark: #f0e6d3;
  --ink: #37342f;
  --muted: #91877a;
  --pink: #f4b8c7;
  --yellow: #f8df87;
  --blue: #b9d5e7;
  --green: #c8ddbd;
  --purple: #d8c9e9;
  --line: #e8ddca;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: 'Gowun Dodum', sans-serif;
  background-color: #d8c8ad;
  background-image:
    radial-gradient(ellipse at 20% 30%, #f0e5d1 0%, transparent 55%),
    radial-gradient(ellipse at 85% 75%, #c9b99d 0%, transparent 55%),
    repeating-linear-gradient(15deg, #ffffff08 0px, #ffffff08 1px, transparent 1px, transparent 4px);
  padding: 22px 12px 50px;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px dashed #9e8060;
  outline-offset: 3px;
}

.app {
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding: 22px;
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, #d8c7ad36 32px),
    radial-gradient(#c7b79d18 0.7px, transparent 0.7px);
  background-size: auto, 5px 5px;
  border: 1px solid #d6c5aa;
  border-radius: 3px;
  box-shadow: 5px 8px 0 #8b785c45, 0 18px 35px #4b3d2b30;
  position: relative;
  overflow: hidden;
}

.app::before {
  content: "";
  position: absolute;
  top: 0;
  left: 20px;
  right: 20px;
  height: 5px;
  background: repeating-linear-gradient(90deg, #e8c8a7 0 12px, transparent 12px 18px);
  opacity: .75;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin: 10px 0 20px;
}

.eyebrow {
  color: #9d8065;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 3px;
}

h1, h2, h3, .hand {
  font-family: 'Gaegu', cursive;
}

h1 {
  font-size: clamp(32px, 7vw, 45px);
  line-height: 1.1;
  margin: 0;
  transform: rotate(-1deg);
}

.subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
}

.icon-button {
  border: 1px solid #cdbb9d;
  background: #fffdf6;
  border-radius: 5px;
  padding: 9px 12px;
  box-shadow: 2px 3px 0 #d8c7ad;
  font-size: 13px;
  white-space: nowrap;
  transform: rotate(1deg);
}

.icon-button:active,
.primary-button:active,
.small-button:active {
  transform: translateY(2px);
  box-shadow: none;
}

.tape {
  position: absolute;
  width: 80px;
  height: 22px;
  top: -8px;
  left: 50%;
  transform: translateX(-50%) rotate(-4deg);
  background: #f3dba5b8;
  border-left: 1px dashed #d1b77d;
  border-right: 1px dashed #d1b77d;
  z-index: 2;
}

.paper-panel {
  position: relative;
  padding: 17px;
  margin: 18px 0;
  border: 1px solid #dfd1bb;
  box-shadow: 2px 3px 0 #b9a78b38;
  background-color: #fffdf7;
}

.memo-panel {
  background-color: #fff1ad;
  background-image: repeating-linear-gradient(
    transparent, transparent 27px, #d9c46a50 28px
  );
  transform: rotate(-.4deg);
  margin-top: 24px;
}

.panel-title {
  font-family: 'Gaegu', cursive;
  font-size: 25px;
  font-weight: 700;
  margin: 0 0 8px;
}

.memo-panel textarea {
  width: 100%;
  min-height: 65px;
  resize: vertical;
  border: none;
  outline: none;
  background: transparent;
  line-height: 28px;
  color: #5b5036;
  font-size: 15px;
}

.memo-panel textarea::placeholder {
  color: #a99b6b;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 25px 2px 10px;
}

.section-heading h2 {
  margin: 0;
  font-size: 27px;
}

.date-label {
  color: #9b8770;
  font-size: 12px;
}

.alert-box {
  border: 1px dashed #d5a0a8;
  background: #fff0f1;
  padding: 12px 14px;
  margin: 15px 0;
  font-size: 13px;
  line-height: 1.8;
  transform: rotate(.25deg);
}

.alert-box strong {
  font-family: 'Gaegu', cursive;
  font-size: 20px;
}

.alert-item {
  padding-left: 5px;
}

.category-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin: 15px 0 20px;
}

.category-tab {
  border: 1px solid #d8cbb7;
  padding: 10px 3px;
  background: #fffdf7;
  font-family: 'Gaegu', cursive;
  font-size: 19px;
  box-shadow: 2px 3px 0 #cdbda4;
  border-radius: 3px;
}

.category-tab:nth-child(1) { transform: rotate(-1deg); }
.category-tab:nth-child(2) { transform: rotate(.8deg); }
.category-tab:nth-child(3) { transform: rotate(-.5deg); }
.category-tab:nth-child(4) { transform: rotate(1deg); }

.category-tab.active {
  background: var(--yellow);
  border-color: #c7a84d;
  box-shadow: 1px 1px 0 #b9a06b;
  transform: translateY(2px) rotate(-.5deg);
}

.category-tab span {
  display: block;
  font-family: 'Gowun Dodum', sans-serif;
  font-size: 11px;
  margin-top: 3px;
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.task-card {
  position: relative;
  background: #fffefa;
  border: 1px solid #e0d6c5;
  padding: 13px 12px 12px;
  box-shadow: 2px 3px 0 #b9a78b38;
  transition: opacity .2s;
}

.task-card:nth-child(odd) {
  transform: rotate(-.25deg);
}

.task-card:nth-child(even) {
  transform: rotate(.25deg);
}

.task-card.done {
  opacity: .62;
  background: #f5f1e8;
}

.task-card.done .task-title {
  text-decoration: line-through;
  color: #938a7d;
}

.task-main {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.check-button {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  margin-top: 2px;
  border: 1.5px solid #9f8e73;
  border-radius: 50%;
  background: transparent;
  font-size: 15px;
  line-height: 1;
}

.task-card.done .check-button {
  background: #b9cfaa;
  border-color: #819975;
}

.task-content {
  min-width: 0;
  flex: 1;
}

.task-title {
  font-size: 15px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 6px;
  color: #938674;
  font-size: 11px;
}

.tag {
  display: inline-block;
  padding: 3px 7px;
  border-radius: 2px;
  color: #62584a;
  font-size: 11px;
}

.tag-today { background: #f6d8df; }
.tag-commission { background: #d8e8f5; }
.tag-homework { background: #dce9ce; }
.tag-general { background: #e9def4; }

.task-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 10px;
  padding-left: 30px;
}

.small-button {
  border: 1px solid #d9cbb5;
  background: #fffdf7;
  padding: 5px 8px;
  border-radius: 3px;
  font-size: 11px;
}

.small-button:hover {
  background: #f7efdf;
}

.subtask-area {
  margin: 12px 0 0 34px;
  padding: 10px;
  background: #f8f3e9;
  border-left: 2px solid #d5bd91;
}

.subtask-heading {
  font-family: 'Gaegu', cursive;
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 5px;
}

.subtask-row {
  margin: 7px 0;
  font-size: 13px;
}

.subtask-top {
  display: flex;
  align-items: flex-start;
  gap: 7px;
}

.subtask-row input,
.nested-row input {
  accent-color: #a8b996;
  margin-top: 3px;
}

.subtask-row.done > .subtask-top .subtask-label,
.nested-row.done .nested-label {
  text-decoration: line-through;
  color: #a39a8c;
}

.subtask-label,
.nested-label {
  flex: 1;
  overflow-wrap: anywhere;
}

.subtask-tools {
  display: flex;
  gap: 8px;
  margin-left: 24px;
  margin-top: 3px;
}

.subtask-tools button {
  background: none;
  border: none;
  padding: 0;
  color: #8c7960;
  font-size: 11px;
  text-decoration: underline;
}

.nested-list {
  margin: 6px 0 0 25px;
  padding-left: 9px;
  border-left: 1px dashed #d5c5aa;
}

.nested-row {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 12px;
  margin: 6px 0;
}

.progress-wrap {
  margin-top: 12px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  color: #8b7c67;
  font-size: 11px;
  margin-bottom: 5px;
}

.progress-track {
  height: 8px;
  background: #e9e0d1;
  border: 1px solid #ddd0bc;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: repeating-linear-gradient(45deg, #b8cfa8 0 6px, #d0dfc5 6px 12px);
  transition: width .2s;
}

.empty-state {
  padding: 28px 12px;
  border: 1px dashed #d8c8ad;
  text-align: center;
  color: #a29582;
  font-family: 'Gaegu', cursive;
  font-size: 22px;
  background: #fffdf8b8;
}

.bottom-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.primary-button {
  border: 1px solid #b9a27e;
  background: var(--yellow);
  padding: 11px 15px;
  box-shadow: 3px 4px 0 #c5b18f;
  border-radius: 3px;
  font-family: 'Gaegu', cursive;
  font-size: 21px;
  flex: 1;
}

.secondary-button {
  border: 1px solid #d0c1a9;
  background: #fffdf7;
  padding: 10px 13px;
  box-shadow: 2px 3px 0 #d2c2a8;
  border-radius: 3px;
}

footer {
  text-align: center;
  color: #a69782;
  font-family: 'Gaegu', cursive;
  font-size: 18px;
  margin-top: 28px;
}

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #30271f88;
  padding: 18px;
  align-items: center;
  justify-content: center;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  position: relative;
  width: 100%;
  max-width: 470px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 22px 18px;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(
    transparent, transparent 31px, #d8c7ad30 32px
  );
  border: 1px solid #d5c3a5;
  box-shadow: 5px 7px 0 #34291e45;
  transform: rotate(-.3deg);
}

.modal h2 {
  margin: 0 0 18px;
  font-size: 29px;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  color: #766853;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px;
  background: #fffdf8;
  border: 1px solid #d7c9b4;
  border-radius: 2px;
  color: var(--ink);
}

.form-group textarea {
  resize: vertical;
  min-height: 70px;
}

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
}

.modal-close {
  position: absolute;
  right: 12px;
  top: 12px;
  border: none;
  background: transparent;
  font-size: 22px;
  color: #8b7b66;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.calendar-header button {
  border: 1px solid #d8c9b4;
  background: #fffdf7;
  padding: 6px 10px;
}

.calendar-month {
  font-family: 'Gaegu', cursive;
  font-size: 25px;
  font-weight: 700;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}

.calendar-weekday {
  text-align: center;
  font-size: 11px;
  color: #97856c;
  padding: 6px 0;
}

.calendar-day {
  position: relative;
  min-height: 49px;
  padding: 5px 2px;
  border: 1px solid #e4d8c5;
  background: #fffdf8;
  text-align: center;
  font-size: 12px;
  cursor: pointer;
}

.calendar-day.empty {
  border-color: transparent;
  background: transparent;
  cursor: default;
}

.calendar-day.today {
  background: #fff0b2;
  border-color: #d4b85e;
}

.calendar-day.selected {
  outline: 2px dashed #b28b60;
  outline-offset: -3px;
}

.calendar-day.has-tasks::after {
  content: "";
  display: block;
  width: 5px;
  height: 5px;
  margin: 4px auto 0;
  border-radius: 50%;
  background: #d98b9c;
}

.calendar-events {
  margin-top: 16px;
  padding: 12px;
  background: #f7f0e3;
  border: 1px dashed #d5c2a3;
  font-size: 13px;
  line-height: 1.8;
}

.calendar-events strong {
  font-family: 'Gaegu', cursive;
  font-size: 21px;
}

.danger-button {
  background: #fae2e0;
  border-color: #ddb5b0;
}

@media (max-width: 480px) {
  body {
    padding: 10px 7px 28px;
  }

  .app {
    padding: 15px 12px;
  }

  .paper-panel {
    padding: 13px;
  }

  .category-tabs {
    gap: 5px;
  }

  .category-tab {
    font-size: 17px;
    padding: 9px 1px;
  }

  .task-card {
    padding: 11px 9px;
  }

  .icon-button {
    padding: 8px;
    font-size: 12px;
  }

  .calendar-day {
    min-height: 42px;
  }
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">MY LITTLE PLANNER · DAILY ARCHIVE</div>
      <h1>오늘의 조각들 ✂</h1>
      <div class="subtitle" id="todayText"></div>
    </div>
    <button class="icon-button" onclick="openCalendar()">▦ 캘린더</button>
  </header>

  <section class="paper-panel memo-panel">
    <div class="tape"></div>
    <h2 class="panel-title">✎ 오늘의 메모</h2>
    <textarea id="quickMemo" placeholder="떠오르는 생각이나 잊으면 안 되는 것들..." aria-label="오늘의 메모"></textarea>
  </section>

  <section>
    <div class="section-heading">
      <h2>놓치면 안 되는 일</h2>
      <span class="date-label">DUE DATE CHECK</span>
    </div>
    <div class="alert-box" id="dueAlerts">
      <strong>오늘의 마감 편지</strong>
      <div>확인 중...</div>
    </div>
  </section>

  <section>
    <div class="section-heading">
      <h2>나의 할 일 목록</h2>
      <span class="date-label" id="taskCount"></span>
    </div>

    <div class="category-tabs">
      <button class="category-tab active" data-category="today" onclick="setCategory('today', this)">
        오늘 할 일<span id="count-today">0개</span>
      </button>
      <button class="category-tab" data-category="commission" onclick="setCategory('commission', this)">
        의뢰<span id="count-commission">0개</span>
      </button>
      <button class="category-tab" data-category="homework" onclick="setCategory('homework', this)">
        숙제<span id="count-homework">0개</span>
      </button>
      <button class="category-tab" data-category="general" onclick="setCategory('general', this)">
        기타<span id="count-general">0개</span>
      </button>
    </div>

    <div class="task-list" id="taskList"></div>

    <div class="bottom-actions">
      <button class="primary-button" onclick="openTaskModal()">＋ 새 할 일 붙이기</button>
      <button class="secondary-button" onclick="openCalendar()">달력 보기</button>
    </div>
  </section>

  <footer>one little step at a time ♡</footer>
</div>

<!-- 할 일 추가 / 수정 -->
<div class="modal-backdrop" id="taskModal" onclick="backdropClose(event, 'taskModal')">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('taskModal')" aria-label="닫기">×</button>
    <h2 id="taskModalTitle">새 할 일 붙이기</h2>

    <form id="taskForm" onsubmit="saveTask(event)">
      <div class="form-group">
        <label for="taskTitle">할 일 이름</label>
        <input id="taskTitle" maxlength="200" required placeholder="예: 수학 숙제 끝내기">
      </div>

      <div class="form-group">
        <label for="taskCategory">분류</label>
        <select id="taskCategory">
          <option value="today">오늘 할 일</option>
          <option value="commission">의뢰</option>
          <option value="homework">숙제</option>
          <option value="general">기타</option>
        </select>
      </div>

      <div class="form-group">
        <label for="taskDue">마감 날짜 (선택)</label>
        <input id="taskDue" type="date">
      </div>

      <div class="form-group">
        <label for="taskNote">메모 (선택)</label>
        <textarea id="taskNote" maxlength="1000" placeholder="추가로 기억할 내용"></textarea>
      </div>

      <div class="modal-buttons">
        <button class="primary-button" type="submit">저장하기</button>
        <button class="secondary-button" type="button" onclick="closeModal('taskModal')">취소</button>
      </div>
    </form>
  </div>
</div>

<!-- 캘린더 -->
<div class="modal-backdrop" id="calendarModal" onclick="backdropClose(event, 'calendarModal')">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('calendarModal')" aria-label="닫기">×</button>
    <h2>나의 작은 달력</h2>

    <div class="calendar-header">
      <button onclick="changeMonth(-1)">← 이전</button>
      <div class="calendar-month" id="calendarMonth"></div>
      <button onclick="changeMonth(1)">다음 →</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="calendar-events" id="calendarEvents"></div>
    <div class="modal-buttons">
      <button class="primary-button" onclick="addTaskForSelectedDate()">＋ 선택한 날짜에 추가</button>
      <button class="secondary-button" onclick="closeModal('calendarModal')">닫기</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'myTodos';
const MEMO_KEY = 'myQuickMemo';
const TODAY_CATEGORY_RESET_KEY = 'myTodosLastResetDate';

const CATEGORY_NAMES = {
  today: '오늘 할 일',
  commission: '의뢰',
  homework: '숙제',
  general: '기타'
};

let todos = loadTodos();
let activeCategory = 'today';
let editingTaskId = null;
let calendarDate = new Date();
let selectedCalendarDate = toDateKey(new Date());

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadTodos() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (!Array.isArray(saved)) return [];

    return saved.map(todo => ({
      id: todo.id || makeId(),
      title: String(todo.title || ''),
      category: CATEGORY_NAMES[todo.category] ? todo.category : 'general',
      due: todo.due || '',
      note: todo.note || '',
      done: Boolean(todo.done),
      createdAt: todo.createdAt || Date.now(),
      subtasks: Array.isArray(todo.subtasks)
        ? todo.subtasks.map(sub => ({
            id: sub.id || makeId(),
            title: String(sub.title || ''),
            done: Boolean(sub.done),
            items: Array.isArray(sub.items)
              ? sub.items.map(item => ({
                  id: item.id || makeId(),
                  title: String(item.title || ''),
                  done: Boolean(item.done)
                }))
              : []
          }))
        : []
    }));
  } catch (error) {
    console.error('할 일 데이터를 읽지 못했습니다.', error);
    return [];
  }
}

function saveTodos() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function toDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function parseDateKey(key) {
  if (!key) return null;
  const parts = key.split('-').map(Number);
  if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function formatDate(key) {
  if (!key) return '';
  const date = parseDateKey(key);
  if (!date || Number.isNaN(date.getTime())) return key;
  return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function updateTodayText() {
  const now = new Date();
  const weekdays = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  document.getElementById('todayText').textContent =
    `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${weekdays[now.getDay()]}`;
}

function loadMemo() {
  document.getElementById('quickMemo').value = localStorage.getItem(MEMO_KEY) || '';
}

document.getElementById('quickMemo').addEventListener('input', event => {
  localStorage.setItem(MEMO_KEY, event.target.value);
});

function setCategory(category, button) {
  activeCategory = category;
  document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
  if (button) button.classList.add('active');
  render();
}

function categoryTag(category) {
  const classNames = {
    today: 'tag-today',
    commission: 'tag-commission',
    homework: 'tag-homework',
    general: 'tag-general'
  };
  return `<span class="tag ${classNames[category] || 'tag-general'}">${escapeHTML(CATEGORY_NAMES[category] || '기타')}</span>`;
}

function getSubtaskProgress(todo) {
  const all = [];
  (todo.subtasks || []).forEach(sub => {
    all.push(sub);
    (sub.items || []).forEach(item => all.push(item));
  });

  if (!all.length) return null;
  const done = all.filter(item => item.done).length;
  return { done, total: all.length, percent: Math.round(done / all.length * 100) };
}

function render() {
  renderTasks();
  renderCounts();
  renderAlerts();
}

function renderCounts() {
  ['today', 'commission', 'homework', 'general'].forEach(category => {
    const count = todos.filter(todo => todo.category === category && !todo.done).length;
    document.getElementById(`count-${category}`).textContent = `${count}개`;
  });

  const visible = todos.filter(todo => todo.category === activeCategory);
  const unfinished = visible.filter(todo => !todo.done).length;
  document.getElementById('taskCount').textContent =
    `총 ${visible.length}개 · 남은 일 ${unfinished}개`;
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const visible = todos
    .filter(todo => todo.category === activeCategory)
    .sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.due && b.due) return a.due.localeCompare(b.due);
      if (a.due) return -1;
      if (b.due) return 1;
      return a.createdAt - b.createdAt;
    });

  if (!visible.length) {
    list.innerHTML = `
      <div class="empty-state">
        아직 붙여 둔 할 일이 없어!<br>
        작은 메모 하나부터 시작해 보자.
      </div>`;
    return;
  }

  list.innerHTML = visible.map(todo => {
    const progress = getSubtaskProgress(todo);
    const subtasksHTML = (todo.subtasks || []).map(sub => {
      const nestedHTML = (sub.items || []).map(item => `
        <div class="nested-row ${item.done ? 'done' : ''}">
          <input type="checkbox" ${item.done ? 'checked' : ''}
            aria-label="${escapeHTML(item.title)} 완료"
            onchange="toggleNested('${todo.id}', '${sub.id}', '${item.id}', this.checked)">
          <span class="nested-label">${escapeHTML(item.title)}</span>
          <button class="small-button" onclick="editNested('${todo.id}', '${sub.id}', '${item.id}')">수정</button>
          <button class="small-button" onclick="deleteNested('${todo.id}', '${sub.id}', '${item.id}')">삭제</button>
        </div>
      `).join('');

      return `
        <div class="subtask-row ${sub.done ? 'done' : ''}">
          <div class="subtask-top">
            <input type="checkbox" ${sub.done ? 'checked' : ''}
              aria-label="${escapeHTML(sub.title)} 완료"
              onchange="toggleSubtask('${todo.id}', '${sub.id}', this.checked)">
            <span class="subtask-label">${escapeHTML(sub.title)}</span>
          </div>
          <div class="subtask-tools">
            <button onclick="addNested('${todo.id}', '${sub.id}')">＋ 세부 항목</button>
            <button onclick="editSubtask('${todo.id}', '${sub.id}')">수정</button>
            <button onclick="deleteSubtask('${todo.id}', '${sub.id}')">삭제</button>
          </div>
          ${nestedHTML ? `<div class="nested-list">${nestedHTML}</div>` : ''}
        </div>`;
    }).join('');

    return `
      <article class="task-card ${todo.done ? 'done' : ''}" data-id="${todo.id}">
        <div class="task-main">
          <button class="check-button" onclick="toggleTask('${todo.id}')"
            aria-label="${todo.done ? '완료 취소' : '완료 처리'}">${todo.done ? '✓' : ''}</button>
          <div class="task-content">
            <div class="task-title">${escapeHTML(todo.title)}</div>
            <div class="task-meta">
              ${categoryTag(todo.category)}
              ${todo.due ? `<span>마감 ${escapeHTML(formatDate(todo.due))}</span>` : ''}
            </div>
            ${todo.note ? `<div style="font-size:12px;color:#8b7e6a;margin-top:8px;white-space:pre-wrap;">${escapeHTML(todo.note)}</div>` : ''}
          </div>
        </div>

        ${progress ? `
          <div class="progress-wrap">
            <div class="progress-label">
              <span>진행 상황</span>
              <span>${progress.done}/${progress.total} · ${progress.percent}%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${progress.percent}%"></div>
            </div>
          </div>` : ''}

        ${subtasksHTML ? `<div class="subtask-area"><div class="subtask-heading">✎ 세부 체크리스트</div>${subtasksHTML}</div>` : ''}

        <div class="task-actions">
          <button class="small-button" onclick="addSubtask('${todo.id}')">＋ 세부 할 일</button>
          <button class="small-button" onclick="editTask('${todo.id}')">수정</button>
          <button class="small-button danger-button" onclick="deleteTask('${todo.id}')">삭제</button>
        </div>
      </article>`;
  }).join('');
}

function renderAlerts() {
  const box = document.getElementById('dueAlerts');
  const today = toDateKey(new Date());

  const urgent = todos
    .filter(todo => !todo.done && todo.due)
    .filter(todo => todo.due <= today)
    .sort((a, b) => a.due.localeCompare(b.due));

  const upcoming = todos
    .filter(todo => !todo.done && todo.due && todo.due > today)
    .sort((a, b) => a.due.localeCompare(b.due))
    .slice(0, 3);

  let html = '<strong>오늘의 마감 편지</strong>';

  if (!urgent.length && !upcoming.length) {
    html += '<div>급한 마감이 없어. 천천히 하나씩 해 보자!</div>';
  } else {
    urgent.forEach(todo => {
      const label = todo.due < today ? '기한 지남' : '오늘 마감';
      html += `<div class="alert-item">✦ <b>${label}</b> · ${escapeHTML(todo.title)} (${escapeHTML(formatDate(todo.due))})</div>`;
    });

    upcoming.forEach(todo => {
      html += `<div class="alert-item">♡ 예정 · ${escapeHTML(todo.title)} (${escapeHTML(formatDate(todo.due))})</div>`;
    });
  }

  box.innerHTML = html;
}

function openModal(id) {
  document.getElementById(id).classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function backdropClose(event, id) {
  if (event.target.id === id) closeModal(id);
}

function openTaskModal() {
  editingTaskId = null;
  document.getElementById('taskForm').reset();
  document.getElementById('taskCategory').value = activeCategory;
  document.getElementById('taskModalTitle').textContent = '새 할 일 붙이기';
  openModal('taskModal');
  setTimeout(() => document.getElementById('taskTitle').focus(), 50);
}

function saveTask(event) {
  event.preventDefault();

  const title = document.getElementById('taskTitle').value.trim();
  if (!title) return;

  const category = document.getElementById('taskCategory').value;
  const due = document.getElementById('taskDue').value;
  const note = document.getElementById('taskNote').value.trim();

  if (editingTaskId) {
    const todo = todos.find(item => item.id === editingTaskId);
    if (todo) {
      todo.title = title;
      todo.category = category;
      todo.due = due;
      todo.note = note;
    }
  } else {
    todos.push({
      id: makeId(),
      title,
      category,
      due,
      note,
      done: false,
      createdAt: Date.now(),
      subtasks: []
    });
  }

  saveTodos();
  activeCategory = category;
  document.querySelectorAll('.category-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.category === category);
  });
  closeModal('taskModal');
  render();
}

function editTask(id) {
  const todo = todos.find(item => item.id === id);
  if (!todo) return;

  editingTaskId = id;
  document.getElementById('taskTitle').value = todo.title;
  document.getElementById('taskCategory').value = todo.category;
  document.getElementById('taskDue').value = todo.due || '';
  document.getElementById('taskNote').value = todo.note || '';
  document.getElementById('taskModalTitle').textContent = '할 일 수정하기';
  openModal('taskModal');
}

function deleteTask(id) {
  const todo = todos.find(item => item.id === id);
  if (!todo) return;
  if (!confirm(`'${todo.title}' 할 일을 삭제할까?`)) return;

  todos = todos.filter(item => item.id !== id);
  saveTodos();
  render();
}

function toggleTask(id) {
  const todo = todos.find(item => item.id === id);
  if (!todo) return;

  todo.done = !todo.done;
  saveTodos();
  render();
}

function addSubtask(id) {
  const todo = todos.find(item => item.id === id);
  if (!todo) return;

  const title = prompt('추가할 세부 할 일 이름을 적어 줘.');
  if (!title || !title.trim()) return;

  todo.subtasks.push({
    id: makeId(),
    title: title.trim(),
    done: false,
    items: []
  });

  saveTodos();
  render();
}

function editSubtask(todoId, subtaskId) {
  const todo = todos.find(item => item.id === todoId);
  const sub = todo?.subtasks.find(item => item.id === subtaskId);
  if (!sub) return;

  const title = prompt('세부 할 일 이름 수정하기', sub.title);
  if (title === null || !title.trim()) return;

  sub.title = title.trim();
  saveTodos();
  render();
}

function deleteSubtask(todoId, subtaskId) {
  const todo = todos.find(item => item.id === todoId);
  if (!todo) return;

  const sub = todo.subtasks.find(item => item.id === subtaskId);
  if (!sub || !confirm(`'${sub.title}' 항목을 삭제할까?`)) return;

  todo.subtasks = todo.subtasks.filter(item => item.id !== subtaskId);
  saveTodos();
  render();
}

function toggleSubtask(todoId, subtaskId, checked) {
  const todo = todos.find(item => item.id === todoId);
  const sub = todo?.subtasks.find(item => item.id === subtaskId);
  if (!sub) return;

  sub.done = checked;
  if (checked) sub.items.forEach(item => item.done = true);
  saveTodos();
  render();
}

function addNested(todoId, subtaskId) {
  const todo = todos.find(item => item.id === todoId);
  const sub = todo?.subtasks.find(item => item.id === subtaskId);
  if (!sub) return;

  const title = prompt('추가할 세부 체크 항목을 적어 줘.');
  if (!title || !title.trim()) return;

  sub.items.push({ id: makeId(), title: title.trim(), done: false });
  sub.done = false;
  saveTodos();
  render();
}

function editNested(todoId, subtaskId, itemId) {
  const todo = todos.find(item => item.id === todoId);
  const sub = todo?.subtasks.find(item => item.id === subtaskId);
  const item = sub?.items.find(entry => entry.id === itemId);
  if (!item) return;

  const title = prompt('세부 항목 수정하기', item.title);
  if (title === null || !title.trim()) return;

  item.title = title.trim();
  saveTodos();
  render();
}

function deleteNested(todoId, subtaskId, itemId) {
  const todo = todos.find(item => item.id === todoId);
  const sub = todo?.subtasks.find(item => item.id === subtaskId);
  if (!sub) return;

  sub.items = sub.items.filter(item => item.id !== itemId);
  saveTodos();
  render();
}

function toggleNested(todoId, subtaskId, itemId, checked) {
  const todo = todos.find(item => item.id === todoId);
  const sub = todo?.subtasks.find(item => item.id === subtaskId);
  const item = sub?.items.find(entry => entry.id === itemId);
  if (!sub || !item) return;

  item.done = checked;
  sub.done = sub.items.length > 0 && sub.items.every(entry => entry.done);
  saveTodos();
  render();
}

/* 캘린더 */

function openCalendar() {
  calendarDate = new Date();
  selectedCalendarDate = toDateKey(new Date());
  renderCalendar();
  openModal('calendarModal');
}

function changeMonth(amount) {
  calendarDate = new Date(
    calendarDate.getFullYear(),
    calendarDate.getMonth() + amount,
    1
  );
  renderCalendar();
}

function renderCalendar() {
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  document.getElementById('calendarMonth').textContent =
    `${year}년 ${month + 1}월`;

  const grid = document.getElementById('calendarGrid');
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

  let html = weekdays.map(day =>
    `<div class="calendar-weekday">${day}</div>`
  ).join('');

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    html += '<div class="calendar-day empty"></div>';
  }

  const today = toDateKey(new Date());

  for (let day = 1; day <= lastDate; day++) {
    const key = toDateKey(new Date(year, month, day));
    const hasTasks = todos.some(todo => todo.due === key);
    const classes = [
      'calendar-day',
      key === today ? 'today' : '',
      key === selectedCalendarDate ? 'selected' : '',
      hasTasks ? 'has-tasks' : ''
    ].filter(Boolean).join(' ');

    html += `<button class="${classes}" onclick="selectCalendarDate('${key}')">${day}</button>`;
  }

  grid.innerHTML = html;
  renderCalendarEvents();
}

function selectCalendarDate(key) {
  selectedCalendarDate = key;
  renderCalendar();
}

function renderCalendarEvents() {
  const events = todos.filter(todo => todo.due === selectedCalendarDate);
  const box = document.getElementById('calendarEvents');

  let html = `<strong>${escapeHTML(formatDate(selectedCalendarDate))}</strong>`;

  if (!events.length) {
    html += '<div>이 날짜에 등록된 마감 일정이 없어.</div>';
  } else {
    html += events.map(todo => `
      <div>· ${todo.done ? '✓' : '○'} ${escapeHTML(todo.title)}
      ${todo.done ? '(완료)' : ''}</div>
    `).join('');
  }

  box.innerHTML = html;
}

function addTaskForSelectedDate() {
  closeModal('calendarModal');
  openTaskModal();
  document.getElementById('taskDue').value = selectedCalendarDate;
}

/* 처음 실행 */

updateTodayText();
loadMemo();
render();
</script>
</body>
