<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 할 일 관리</title>

<style>
:root {
    --bg-color: #f0f7ff;
    --card-bg: #ffffff;
    --primary-color: #60a5fa;
    --primary-hover: #3b82f6;
    --primary-light: #e0f2fe;
    --danger-color: #f87171;
    --danger-hover: #ef4444;
    --success-color: #4ade80;
    --text-color: #334155;
    --text-sub: #64748b;
    --border-radius: 16px;
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
    user-select: none;
}

.container {
    width: 100%;
    max-width: 580px;
}

h1 {
    text-align: center;
    color: #2563eb;
    font-size: 1.6rem;
    margin-bottom: 20px;
}

/* =========================
   빠른 메모
========================= */

.memo-section {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
    border: 1.5px solid #bae6fd;
}

.memo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.memo-section h2 {
    margin: 0;
    color: #0284c7;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
}

.memo-toggle {
    border: none;
    background: #e0f2fe;
    color: #0284c7;
    border-radius: 8px;
    padding: 5px 9px;
    cursor: pointer;
    font-weight: 600;
}

.memo-body {
    margin-top: 10px;
}

.memo-section.collapsed .memo-body {
    display: none;
}

.memo-textarea {
    width: 100%;
    min-height: 60px;
    border: 1px solid #e0f2fe;
    background-color: #f8fafc;
    border-radius: 12px;
    padding: 10px 12px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.92rem;
    color: var(--text-color);
    outline: none;
    resize: none;
    overflow: hidden;
    line-height: 1.5;
}

.memo-textarea:focus {
    border-color: var(--primary-color);
    background-color: #ffffff;
}

/* =========================
   상단 달력
========================= */

.top-tools {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
}

.calendar-open-btn {
    border: 1.5px solid #bae6fd;
    background: white;
    color: #0284c7;
    border-radius: 12px;
    padding: 8px 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(186,230,253,.25);
}

.calendar-open-btn:active {
    transform: scale(.97);
}

/* =========================
   마감 알림
========================= */

.due-alert-section {
    background-color: #fff1f2;
    border: 2px solid #fecdd3;
    border-radius: var(--border-radius);
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(244, 63, 94, 0.08);
}

.due-alert-section h2 {
    margin: 0 0 10px 0;
    color: #e11d48;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* =========================
   분류
========================= */

.category-group {
    margin-bottom: 20px;
}

.category-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #bae6fd;
}

/* =========================
   추가 버튼
========================= */

.add-btn-main {
    width: 100%;
    padding: 14px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(96, 165, 250, 0.35);
}

.add-btn-main:hover {
    background-color: var(--primary-hover);
}

/* =========================
   할 일 카드
========================= */

.todo-card-wrapper {
    position: relative;
    margin-bottom: 16px;
    border-radius: var(--border-radius);
    overflow: hidden;
    background-color: var(--success-color);
    box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
}

.swipe-hint {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-weight: bold;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 1;
}

.todo-card {
    position: relative;
    z-index: 2;
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 18px 20px;
    transition: transform 0.1s ease-out;
    touch-action: pan-y;
}

.todo-card-standalone {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 18px 20px;
    box-shadow: 0 4px 16px rgba(186, 230, 253, 0.25);
    margin-bottom: 16px;
}

.todo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.todo-title {
    font-weight: 700;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 8px;
    word-break: break-all;
}

.due-date {
    font-size: 0.78rem;
    color: #0284c7;
    background: var(--primary-light);
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 500;
    white-space: nowrap;
}

/* =========================
   진행률
========================= */

.progress-container {
    margin-top: 14px;
}

.progress-bar-bg {
    background-color: #e0f2fe;
    height: 12px;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar-fill {
    background: linear-gradient(90deg, #93c5fd, #3b82f6);
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: width 0.4s ease;
}

.progress-text {
    font-size: 0.85rem;
    text-align: right;
    color: var(--text-sub);
    margin-top: 6px;
    font-weight: 600;
}

.percent-val {
    color: #2563eb;
    font-size: 0.95rem;
}

/* =========================
   세부 목록
========================= */

.subtasks-list {
    margin-top: 14px;
    border-top: 1px solid #f1f5f9;
    padding-top: 10px;
}

.subtask-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.93rem;
    margin-top: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    background-color: #f8fafc;
}

.subtask-item.completed span {
    text-decoration: line-through;
    color: #94a3b8;
}

/* =========================
   중첩 세부목록
========================= */

.nested-details {
    margin-top: 10px;
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 12px;
    padding: 8px 12px;
}

.nested-summary {
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    color: #0369a1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    outline: none;
    list-style: none;
}

.nested-summary::-webkit-details-marker {
    display: none;
}

.nested-summary-title::before {
    content: '▶ ';
    font-size: 0.75rem;
    margin-right: 6px;
    display: inline-block;
    transition: transform 0.2s;
}

.nested-details[open] .nested-summary-title::before {
    transform: rotate(90deg);
}

.nested-content {
    margin-top: 10px;
    padding-left: 10px;
    border-left: 2px solid #93c5fd;
}

.subtask-input-group {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.subtask-input-group select,
.subtask-input-group input[type="date"] {
    padding: 6px;
    border: 1.5px solid #bae6fd;
    border-radius: 10px;
    font-size: 0.85rem;
    outline: none;
    background: #ffffff;
}

.subtask-input-group input[type="text"] {
    flex: 1;
    min-width: 140px;
    padding: 6px 10px;
    border: 1.5px solid #bae6fd;
    border-radius: 10px;
    outline: none;
    font-size: 0.88rem;
}

.subtask-input-group button {
    background: var(--primary-color);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 6px 12px;
    font-weight: 600;
    cursor: pointer;
}

/* =========================
   버튼
========================= */

.btn-action {
    background: none;
    border: none;
    color: var(--text-sub);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
    border-radius: 6px;
}

.btn-action:hover {
    background-color: #e0f2fe;
    color: #0284c7;
}

.btn-delete {
    background: none;
    border: none;
    color: #cbd5e1;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9rem;
    padding: 2px 6px;
    border-radius: 6px;
}

.btn-delete:hover {
    color: var(--danger-color);
    background-color: #fef2f2;
}

/* =========================
   모달
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.35);
    backdrop-filter: blur(3px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
}

.modal-content {
    background: white;
    padding: 24px;
    border-radius: 24px;
    width: 88%;
    max-width: 380px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

.modal-content.wide {
    max-width: 500px;
}

.modal-content h3 {
    margin-top: 0;
    margin-bottom: 16px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    color: #475569;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #bae6fd;
    border-radius: 12px;
    outline: none;
    font-size: 0.95rem;
    background-color: #f8fafc;
}

.form-group input:disabled {
    background-color: #f1f5f9;
    color: #94a3b8;
}

.modal-btns {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.btn-secondary,
.btn-primary,
.btn-danger {
    border: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
}

.btn-secondary {
    background: #f1f5f9;
    color: #64748b;
}

.btn-primary {
    background: var(--primary-color);
    color: white;
}

.btn-danger {
    background: var(--danger-color);
    color: white;
}

/* =========================
   세부사항 편집용
========================= */

.edit-item-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
}

.edit-item-row {
    display: flex;
    align-items: center;
    gap: 7px;
}

.edit-item-row input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1.5px solid #bae6fd;
    border-radius: 9px;
    background: white;
    outline: none;
}

.edit-item-row input[type="date"] {
    width: 145px;
    padding: 7px;
    border: 1.5px solid #bae6fd;
    border-radius: 9px;
    background: white;
}

.edit-item-row button {
    flex-shrink: 0;
}

.edit-section {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #e2e8f0;
}

.edit-section-title {
    font-weight: 700;
    margin-bottom: 9px;
    color: #475569;
    font-size: .9rem;
}

.add-edit-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.add-edit-row input[type="text"] {
    flex: 1;
    min-width: 130px;
    padding: 9px;
    border: 1.5px solid #bae6fd;
    border-radius: 9px;
    outline: none;
}

.add-edit-row input[type="date"] {
    padding: 8px;
    border: 1.5px solid #bae6fd;
    border-radius: 9px;
    outline: none;
}

.add-edit-row button {
    border: none;
    background: var(--primary-color);
    color: white;
    border-radius: 9px;
    padding: 8px 12px;
    font-weight: 600;
}

/* =========================
   달력
========================= */

.calendar-modal-content {
    max-width: 500px;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.calendar-header button {
    border: none;
    background: #f1f5f9;
    color: #475569;
    border-radius: 9px;
    padding: 7px 10px;
    cursor: pointer;
    font-weight: 700;
}

.calendar-title {
    font-weight: 800;
    font-size: 1.05rem;
}

.calendar-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
    margin-bottom: 4px;
}

.calendar-week div {
    font-size: 0.75rem;
    color: #64748b;
    font-weight: 700;
    padding: 5px 0;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}

.calendar-day {
    min-height: 58px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    padding: 5px;
    cursor: pointer;
    overflow: hidden;
}

.calendar-day:hover {
    background: #f8fafc;
}

.calendar-day.selected {
    border: 2px solid #60a5fa;
    background: #eff6ff;
}

.calendar-day.today {
    background: #f0fdf4;
}

.calendar-number {
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 3px;
}

.calendar-event {
    font-size: 0.62rem;
    line-height: 1.2;
    padding: 2px 3px;
    border-radius: 4px;
    background: #dbeafe;
    color: #1d4ed8;
    margin-top: 2px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.calendar-event.today-event {
    background: #dcfce7;
    color: #15803d;
}

.calendar-event.completed {
    background: #e2e8f0;
    color: #94a3b8;
    text-decoration: line-through;
}

.calendar-detail {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #e2e8f0;
}

.calendar-detail-title {
    font-weight: 800;
    margin-bottom: 10px;
}

.calendar-detail-empty {
    color: #94a3b8;
    font-size: 0.85rem;
}

.calendar-detail-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 4px;
    border-bottom: 1px solid #f1f5f9;
}

.calendar-detail-left {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
}

.calendar-detail-left span {
    word-break: break-all;
}

.calendar-detail-actions {
    display: flex;
    gap: 3px;
    flex-shrink: 0;
}

.calendar-close {
    width: 100%;
    margin-top: 16px;
    padding: 11px;
    border: none;
    border-radius: 12px;
    background: #334155;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <h1>📝 스마트 할 일 관리</h1>

    <div class="top-tools">
        <button class="calendar-open-btn" onclick="openCalendar()">
            📅 마감 달력
        </button>
    </div>

    <div class="memo-section" id="memoSection">
        <div class="memo-header">
            <h2>✏️ 빠른 메모장</h2>
            <button class="memo-toggle" id="memoToggle" onclick="toggleMemo()">
                접기 ▲
            </button>
        </div>

        <div class="memo-body">
            <textarea
                id="quickMemo"
                class="memo-textarea"
                placeholder="자유롭게 메모를 남겨보세요... (자동 저장)"
            ></textarea>
        </div>
    </div>

    <div id="dueAlertSection"
         class="due-alert-section"
         style="display:none;">

        <h2>🚨 마감 오늘 / 지남!</h2>
        <div id="dueAlertList"></div>

    </div>

    <button class="add-btn-main" onclick="openModal()">
        + 새 할 일 추가하기
    </button>

    <div id="todayTaskSection"
         class="category-group"
         style="display:none;">

        <div class="category-title" style="color:#0284c7;">
            ☀️ 오늘 할 일 목록
        </div>

        <div id="todayTaskList"></div>

    </div>

    <div id="commissionSection"
         class="category-group"
         style="display:none;">

        <div class="category-title" style="color:#d97706;">
            🎨 커미션 목록
        </div>

        <div id="commissionList"></div>

    </div>

    <div id="homeworkSection"
         class="category-group"
         style="display:none;">

        <div class="category-title" style="color:#7e22ce;">
            📚 숙제 목록
        </div>

        <div id="homeworkList"></div>

    </div>

    <div id="mainSection" class="category-group">

        <div
            class="category-title"
            id="mainSectionTitle"
            style="color:#64748b;display:none;"
        >
            📋 기타 및 일반 할 일
        </div>

        <div id="todoList"></div>

    </div>

</div>


<!-- =========================
     할 일 추가 / 수정
========================= -->

<div id="todoModal" class="modal">

    <div class="modal-content">

        <h3 id="modalTitle">✨ 새 할 일 추가</h3>

        <div class="form-group">
            <label>특성 분류</label>

            <select id="todoCategory"
                    onchange="handleCategoryChange()">

                <option value="none">일반 할 일</option>
                <option value="today">☀️ 오늘 할 일</option>
                <option value="commission">🎨 커미션</option>
                <option value="homework">📚 숙제</option>

            </select>
        </div>

        <div class="form-group">
            <label>표시 방식 선택</label>

            <select id="todoType">

                <option value="simple">
                    1. 일반 방식 (밀어서 완료)
                </option>

                <option value="project">
                    2. 세부목록 방식 (진행률 표시)
                </option>

            </select>
        </div>

        <div class="form-group">
            <label>할 일 제목</label>

            <input
                type="text"
                id="todoTitle"
                placeholder="할 일을 입력해주세요"
            >
        </div>

        <div class="form-group">
            <label>마감기한 (선택)</label>

            <input
                type="date"
                id="todoDueDate"
            >
        </div>

        <div class="modal-btns">

            <button class="btn-secondary"
                    onclick="closeModal()">
                취소
            </button>

            <button class="btn-primary"
                    id="saveTodoBtn"
                    onclick="addTodo()">
                추가하기
            </button>

        </div>

    </div>

</div>


<!-- =========================
     세부사항 편집
========================= -->

<div id="subtaskEditModal" class="modal">

    <div class="modal-content wide">

        <h3 id="subtaskEditTitle">
            ✏️ 세부사항 수정
        </h3>

        <div class="form-group">

            <label>세부사항 종류</label>

            <select
                id="editSubtaskType"
                onchange="handleEditSubtaskTypeChange()"
            >

                <option value="simple">
                    일반 항목
                </option>

                <option value="list">
                    📂 세부목록 방식
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>제목</label>

            <input
                type="text"
                id="editSubtaskText"
                placeholder="세부사항 제목"
            >

        </div>

        <div
            class="form-group"
            id="editSubtaskDateGroup"
        >

            <label>마감기한 (선택)</label>

            <input
                type="date"
                id="editSubtaskDate"
            >

        </div>


        <!-- 목록형일 때만 표시 -->

        <div
            id="editSubtaskItemsSection"
            class="edit-section"
            style="display:none;"
        >

            <div class="edit-section-title">
                📂 목록 안의 항목
            </div>

            <div id="editSubtaskItems"></div>

            <div class="add-edit-row">

                <input
                    type="text"
                    id="newEditItemText"
                    placeholder="새 항목 입력..."
                >

                <button onclick="addEditSubtaskItem()">
                    + 추가
                </button>

            </div>

        </div>


        <div class="modal-btns">

            <button
                class="btn-secondary"
                onclick="closeSubtaskEditModal()"
            >
                취소
            </button>

            <button
                class="btn-primary"
                onclick="saveSubtaskEdit()"
            >
                수정 완료
            </button>

        </div>

    </div>

</div>


<!-- =========================
     삭제 모달
========================= -->

<div id="deleteModal" class="modal">

    <div class="modal-content">

        <h3>🗑️ 진짜 삭제하시겠습니까?</h3>

        <p style="color:var(--text-sub);font-size:.95rem;">
            삭제된 항목은 복구할 수 없습니다.
        </p>

        <div class="modal-btns">

            <button class="btn-secondary"
                    onclick="closeDeleteModal()">
                취소
            </button>

            <button
                class="btn-danger"
                id="confirmDeleteBtn">
                삭제하기
            </button>

        </div>

    </div>

</div>


<!-- =========================
     달력 모달
========================= -->

<div id="calendarModal" class="modal">

    <div class="modal-content calendar-modal-content">

        <div class="calendar-header">

            <button onclick="changeCalendarMonth(-1)">
                ◀
            </button>

            <div
                id="calendarTitle"
                class="calendar-title">
            </div>

            <button onclick="changeCalendarMonth(1)">
                ▶
            </button>

        </div>

        <div class="calendar-week">

            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>

        </div>

        <div
            id="calendarGrid"
            class="calendar-grid">
        </div>

        <div class="calendar-detail">

            <div
                id="calendarDetailTitle"
                class="calendar-detail-title">
                날짜를 선택해주세요.
            </div>

            <div
                id="calendarDetailList">
            </div>

        </div>

        <button
            class="calendar-close"
            onclick="closeCalendar()">
            닫기
        </button>

    </div>

</div>


<script>

/* =========================================================
   데이터
========================================================= */

let todos =
    JSON.parse(localStorage.getItem('myTodos')) || [];

let deleteTarget = null;
let editingTodoId = null;

/* 세부사항 편집 대상 */
let editingSubtaskInfo = null;


/* =========================================================
   날짜
========================================================= */

function getTodayString() {

    const today = new Date();

    return `${today.getFullYear()}-${String(
        today.getMonth() + 1
    ).padStart(2,'0')}-${String(
        today.getDate()
    ).padStart(2,'0')}`;

}


/* =========================================================
   날짜 변경
========================================================= */

function checkDateChangeAndCleanup() {

    const todayStr = getTodayString();

    const lastVisitedDate =
        localStorage.getItem('lastVisitedDate');

    if (
        lastVisitedDate &&
        lastVisitedDate !== todayStr
    ) {

        todos =
            todos.filter(
                t => t.category !== 'today'
            );

        saveData();

    }

    localStorage.setItem(
        'lastVisitedDate',
        todayStr
    );

}

checkDateChangeAndCleanup();


/* =========================================================
   메모
========================================================= */

const memoTextarea =
    document.getElementById('quickMemo');

memoTextarea.value =
    localStorage.getItem('myQuickMemo') || '';


function autoResizeMemo(el) {

    el.style.height = 'auto';

    el.style.height =
        el.scrollHeight + 'px';

}

autoResizeMemo(memoTextarea);


memoTextarea.addEventListener(
    'input',
    () => {

        localStorage.setItem(
            'myQuickMemo',
            memoTextarea.value
        );

        autoResizeMemo(memoTextarea);

    }
);


function toggleMemo() {

    const section =
        document.getElementById('memoSection');

    const button =
        document.getElementById('memoToggle');

    section.classList.toggle('collapsed');

    if (
        section.classList.contains('collapsed')
    ) {

        button.textContent = '펼치기 ▼';

    } else {

        button.textContent = '접기 ▲';

        setTimeout(
            () => autoResizeMemo(memoTextarea),
            0
        );

    }

}


/* =========================================================
   저장
========================================================= */

function saveData() {

    localStorage.setItem(
        'myTodos',
        JSON.stringify(todos)
    );

}


/* =========================================================
   분류
========================================================= */

function handleCategoryChange() {

    const category =
        document.getElementById(
            'todoCategory'
        ).value;

    const dateInput =
        document.getElementById(
            'todoDueDate'
        );

    if (category === 'today') {

        dateInput.value = '';
        dateInput.disabled = true;

    } else {

        dateInput.disabled = false;

    }

}


/* =========================================================
   할 일 추가 / 수정
========================================================= */

function openModal(editId = null) {

    editingTodoId = editId;

    const modalTitle =
        document.getElementById('modalTitle');

    const saveBtn =
        document.getElementById('saveTodoBtn');

    if (editId) {

        const todo =
            todos.find(t => t.id === editId);

        if (!todo) return;

        modalTitle.innerText =
            '✏️ 할 일 수정';

        document.getElementById(
            'todoCategory'
        ).value =
            todo.category || 'none';

        document.getElementById(
            'todoType'
        ).value =
            todo.type;

        document.getElementById(
            'todoTitle'
        ).value =
            todo.title;

        document.getElementById(
            'todoDueDate'
        ).value =
            todo.dueDate || '';

        saveBtn.innerText =
            '수정 완료';

        saveBtn.onclick =
            updateTodo;

    } else {

        modalTitle.innerText =
            '✨ 새 할 일 추가';

        document.getElementById(
            'todoCategory'
        ).value = 'none';

        document.getElementById(
            'todoType'
        ).value = 'simple';

        document.getElementById(
            'todoTitle'
        ).value = '';

        document.getElementById(
            'todoDueDate'
        ).value = '';

        saveBtn.innerText =
            '추가하기';

        saveBtn.onclick =
            addTodo;

    }

    handleCategoryChange();

    document.getElementById(
        'todoModal'
    ).style.display = 'flex';

}


function closeModal() {

    document.getElementById(
        'todoModal'
    ).style.display = 'none';

    editingTodoId = null;

}


/* =========================================================
   할 일 추가
========================================================= */

function addTodo() {

    const category =
        document.getElementById(
            'todoCategory'
        ).value;

    const type =
        document.getElementById(
            'todoType'
        ).value;

    const title =
        document.getElementById(
            'todoTitle'
        ).value.trim();

    const dueDate =
        document.getElementById(
            'todoDueDate'
        ).value;

    if (!title) {

        alert('제목을 입력해주세요.');

        return;

    }

    todos.push({

        id: Date.now(),

        category,

        type,

        title,

        dueDate:
            category === 'today'
                ? null
                : (dueDate || null),

        subtasks: []

    });

    saveData();

    render();

    closeModal();

}


/* =========================================================
   할 일 수정
========================================================= */

function updateTodo() {

    const todo =
        todos.find(
            t => t.id === editingTodoId
        );

    if (!todo) return;

    const title =
        document.getElementById(
            'todoTitle'
        ).value.trim();

    if (!title) {

        alert('제목을 입력해주세요.');

        return;

    }

    const category =
        document.getElementById(
            'todoCategory'
        ).value;

    const newType =
        document.getElementById(
            'todoType'
        ).value;

    todo.category =
        category;

    /*
       기존 프로젝트의 세부사항은
       프로젝트 상태를 유지하는 동안 그대로 보존.
       simple -> project로 변경하면 subtasks가 유지된다.
    */
    todo.type =
        newType;

    todo.title =
        title;

    todo.dueDate =
        category === 'today'
            ? null
            : (
                document.getElementById(
                    'todoDueDate'
                ).value || null
            );

    if (!todo.subtasks)
        todo.subtasks = [];

    saveData();

    render();

    closeModal();

}


/* =========================================================
   삭제
========================================================= */

function openDeleteModal(
    type,
    todoId,
    subtaskId = null,
    nestedId = null
) {

    deleteTarget = {
        type,
        todoId,
        subtaskId,
        nestedId
    };

    document.getElementById(
        'deleteModal'
    ).style.display = 'flex';

    document.getElementById(
        'confirmDeleteBtn'
    ).onclick = () => {

        executeDelete();

        closeDeleteModal();

    };

}


function closeDeleteModal() {

    document.getElementById(
        'deleteModal'
    ).style.display = 'none';

    deleteTarget = null;

}


function executeDelete() {

    if (!deleteTarget) return;

    const {
        type,
        todoId,
        subtaskId,
        nestedId
    } = deleteTarget;


    if (type === 'todo') {

        todos =
            todos.filter(
                t => t.id !== todoId
            );

        saveData();

        render();

    }


    else if (type === 'subtask') {

        const todo =
            todos.find(
                t => t.id === todoId
            );

        if (todo) {

            todo.subtasks =
                todo.subtasks.filter(
                    s => s.id !== subtaskId
                );

            saveData();

            render();

        }

    }


    else if (type === 'nested') {

        const todo =
            todos.find(
                t => t.id === todoId
            );

        const parentSub =
            todo
                ? todo.subtasks.find(
                    s => s.id === subtaskId
                )
                : null;

        if (
            parentSub &&
            parentSub.items
        ) {

            parentSub.items =
                parentSub.items.filter(
                    n => n.id !== nestedId
                );

            saveData();

            render();

        }

    }

}


/* =========================================================
   진행률
========================================================= */

function calculateTodoProgress(todo) {

    if (
        !todo ||
        !todo.subtasks ||
        todo.subtasks.length === 0
    ) {

        return 0;

    }

    let totalPoints = 0;
    let completedPoints = 0;


    todo.subtasks.forEach(sub => {

        if (sub.type === 'list') {

            const items =
                sub.items || [];

            if (items.length === 0) {

                totalPoints += 1;

                if (sub.completed)
                    completedPoints += 1;

            } else {

                totalPoints += items.length;

                completedPoints +=
                    items.filter(
                        i => i.completed
                    ).length;

            }

        } else {

            totalPoints += 1;

            if (sub.completed)
                completedPoints += 1;

        }

    });


    if (totalPoints === 0)
        return 0;


    return Math.round(
        (completedPoints / totalPoints) * 100
    );

}


function updateProgressUI(todoId) {

    const todo =
        todos.find(
            t => t.id === todoId
        );

    if (
        !todo ||
        todo.type !== 'project'
    ) return;

    const percent =
        calculateTodoProgress(todo);

    const bar =
        document.getElementById(
            `bar-${todoId}`
        );

    const text =
        document.getElementById(
            `percent-${todoId}`
        );

    if (bar && text) {

        bar.style.width =
            percent + '%';

        text.innerText =
            percent;

    }

}


/* =========================================================
   ★ 세부사항 편집
========================================================= */

function openSubtaskEditModal(
    todoId,
    subtaskId
) {

    const todo =
        todos.find(
            t => t.id === todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s => s.id === subtaskId
        );

    if (!subtask) return;

    editingSubtaskInfo = {
        todoId,
        subtaskId
    };

    document.getElementById(
        'editSubtaskType'
    ).value =
        subtask.type || 'simple';

    document.getElementById(
        'editSubtaskText'
    ).value =
        subtask.text || '';

    document.getElementById(
        'editSubtaskDate'
    ).value =
        subtask.dueDate || '';

    renderEditSubtaskItems();

    handleEditSubtaskTypeChange();

    document.getElementById(
        'subtaskEditModal'
    ).style.display = 'flex';

}


function closeSubtaskEditModal() {

    document.getElementById(
        'subtaskEditModal'
    ).style.display = 'none';

    editingSubtaskInfo = null;

}


/*
   종류에 따라 마감일 / 목록 편집 표시
*/
function handleEditSubtaskTypeChange() {

    const type =
        document.getElementById(
            'editSubtaskType'
        ).value;

    const dateGroup =
        document.getElementById(
            'editSubtaskDateGroup'
        );

    const itemsSection =
        document.getElementById(
            'editSubtaskItemsSection'
        );

    if (type === 'list') {

        dateGroup.style.display =
            'none';

        itemsSection.style.display =
            'block';

    } else {

        dateGroup.style.display =
            'block';

        itemsSection.style.display =
            'none';

    }

}


/*
   목록형 세부사항의 항목 편집 화면
*/
function renderEditSubtaskItems() {

    const box =
        document.getElementById(
            'editSubtaskItems'
        );

    if (!editingSubtaskInfo) return;

    const todo =
        todos.find(
            t => t.id === editingSubtaskInfo.todoId
        );

    const subtask =
        todo
            ? todo.subtasks.find(
                s =>
                    s.id ===
                    editingSubtaskInfo.subtaskId
            )
            : null;

    if (!subtask) return;

    const items =
        subtask.items || [];

    if (items.length === 0) {

        box.innerHTML = `
            <div style="
                color:#94a3b8;
                font-size:.85rem;
                padding:6px 0 10px;
            ">
                아직 목록 항목이 없습니다.
            </div>
        `;

        return;

    }


    box.innerHTML =
        items.map(item => `

            <div class="edit-item-box">

                <div class="edit-item-row">

                    <input
                        type="checkbox"
                        ${item.completed ? 'checked' : ''}
                        onchange="
                            toggleEditItemCompleted(
                                ${item.id}
                            )
                        "
                    >

                    <input
                        type="text"
                        id="edit-item-text-${item.id}"
                        value="${escapeHTML(item.text || '')}"
                        placeholder="항목 이름"
                    >

                    <button
                        class="btn-delete"
                        onclick="
                            deleteEditSubtaskItem(
                                ${item.id}
                            )
                        "
                    >
                        ✕
                    </button>

                </div>

            </div>

        `).join('');

}


/*
   편집 중인 목록 항목 완료 상태 변경
*/
function toggleEditItemCompleted(itemId) {

    if (!editingSubtaskInfo) return;

    const todo =
        todos.find(
            t => t.id === editingSubtaskInfo.todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s =>
                s.id ===
                editingSubtaskInfo.subtaskId
        );

    if (!subtask || !subtask.items)
        return;

    const item =
        subtask.items.find(
            i => i.id === itemId
        );

    if (!item) return;

    item.completed =
        !item.completed;

    saveData();

    renderEditSubtaskItems();

}


/*
   편집 중 목록 항목 삭제
*/
function deleteEditSubtaskItem(itemId) {

    if (!editingSubtaskInfo) return;

    const todo =
        todos.find(
            t => t.id === editingSubtaskInfo.todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s =>
                s.id ===
                editingSubtaskInfo.subtaskId
        );

    if (!subtask || !subtask.items)
        return;

    subtask.items =
        subtask.items.filter(
            i => i.id !== itemId
        );

    saveData();

    renderEditSubtaskItems();

}


/*
   편집 중인 목록에 새 항목 추가
*/
function addEditSubtaskItem() {

    if (!editingSubtaskInfo) return;

    const input =
        document.getElementById(
            'newEditItemText'
        );

    const text =
        input.value.trim();

    if (!text) return;

    const todo =
        todos.find(
            t => t.id === editingSubtaskInfo.todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s =>
                s.id ===
                editingSubtaskInfo.subtaskId
        );

    if (!subtask) return;

    if (!subtask.items)
        subtask.items = [];

    subtask.items.push({

        id:
            Date.now() +
            Math.floor(Math.random() * 1000),

        text,

        completed: false

    });

    input.value = '';

    saveData();

    renderEditSubtaskItems();

}


/*
   세부사항 수정 완료
*/
function saveSubtaskEdit() {

    if (!editingSubtaskInfo) return;

    const todo =
        todos.find(
            t => t.id === editingSubtaskInfo.todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s =>
                s.id ===
                editingSubtaskInfo.subtaskId
        );

    if (!subtask) return;


    const newType =
        document.getElementById(
            'editSubtaskType'
        ).value;

    const newText =
        document.getElementById(
            'editSubtaskText'
        ).value.trim();

    if (!newText) {

        alert('세부사항 제목을 입력해주세요.');

        return;

    }


    /*
       일반 ↔ 목록 변경
    */

    if (newType === 'list') {

        subtask.type =
            'list';

        subtask.text =
            newText;

        /*
           목록형에는 일반 항목의 마감일을
           사용하지 않음
        */
        subtask.dueDate =
            null;

        if (!subtask.items)
            subtask.items = [];

    } else {

        subtask.type =
            'simple';

        subtask.text =
            newText;

        subtask.dueDate =
            document.getElementById(
                'editSubtaskDate'
            ).value || null;

        /*
           일반 항목으로 바꾸면
           기존 목록 데이터는 삭제하지 않고
           보존해둔다.
           다시 목록으로 바꾸면 복구 가능.
        */

    }


    /*
       목록 편집창에서 입력해 둔 텍스트를
       실제 데이터에 반영
    */

    if (
        subtask.items &&
        Array.isArray(subtask.items)
    ) {

        subtask.items.forEach(item => {

            const input =
                document.getElementById(
                    `edit-item-text-${item.id}`
                );

            if (input) {

                const value =
                    input.value.trim();

                if (value)
                    item.text = value;

            }

        });

    }


    saveData();

    const todoId =
        editingSubtaskInfo.todoId;

    closeSubtaskEditModal();

    updateProgressUI(todoId);

    renderSubtasksUI(todoId);

    render();

}


/*
   HTML 특수문자 처리
*/
function escapeHTML(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


/* =========================================================
   세부목록 UI
========================================================= */

function renderSubtasksUI(todoId) {

    const todo =
        todos.find(
            t => t.id === todoId
        );

    const subListEl =
        document.getElementById(
            `sublist-${todoId}`
        );

    if (!todo || !subListEl)
        return;


    /*
       현재 열려 있던 목록 기억
    */

    const openStates = {};

    subListEl
        .querySelectorAll(
            '.nested-details'
        )
        .forEach(details => {

            const key =
                details.dataset.subtaskId;

            openStates[key] =
                details.open;

        });


    subListEl.innerHTML =
        todo.subtasks.map(sub => {


            /* =====================
               목록형
            ===================== */

            if (sub.type === 'list') {

                const items =
                    sub.items || [];

                const total =
                    items.length;

                const completed =
                    items.filter(
                        i => i.completed
                    ).length;

                const percent =
                    total === 0
                        ? 0
                        : Math.round(
                            (completed / total) * 100
                        );


                const oldOpen =
                    openStates[sub.id]
                        ? 'open'
                        : '';


                const nestedHTML =
                    items.map(n => `

                        <div class="subtask-item
                            ${n.completed ? 'completed' : ''}">

                            <div style="
                                display:flex;
                                align-items:center;
                                gap:8px;
                                min-width:0;
                            ">

                                <input
                                    type="checkbox"
                                    ${n.completed ? 'checked' : ''}
                                    onchange="
                                        toggleNestedItem(
                                            ${todo.id},
                                            ${sub.id},
                                            ${n.id}
                                        )
                                    "
                                >

                                <span>
                                    ${escapeHTML(n.text)}
                                </span>

                            </div>

                            <div>

                                <button
                                    class="btn-action"
                                    onclick="
                                        openSubtaskEditModal(
                                            ${todo.id},
                                            ${sub.id}
                                        )
                                    "
                                >
                                    수정
                                </button>

                                <button
                                    class="btn-delete"
                                    onclick="
                                        openDeleteModal(
                                            'nested',
                                            ${todo.id},
                                            ${sub.id},
                                            ${n.id}
                                        )
                                    "
                                >
                                    ✕
                                </button>

                            </div>

                        </div>

                    `).join('');


                return `

                    <details
                        class="nested-details"
                        data-subtask-id="${sub.id}"
                        ${oldOpen}
                    >

                        <summary class="nested-summary">

                            <span class="nested-summary-title">
                                📂 ${escapeHTML(sub.text)}
                            </span>

                            <div
                                style="
                                    display:flex;
                                    align-items:center;
                                    gap:5px;
                                "
                                onclick="
                                    event.stopPropagation();
                                "
                            >

                                <span
                                    style="
                                        font-size:.8rem;
                                        color:#0284c7;
                                    "
                                >
                                    ${percent}%
                                </span>

                                <button
                                    class="btn-action"
                                    onclick="
                                        event.preventDefault();
                                        event.stopPropagation();
                                        openSubtaskEditModal(
                                            ${todo.id},
                                            ${sub.id}
                                        )
                                    "
                                >
                                    수정
                                </button>

                            </div>

                        </summary>

                        <div class="nested-content">

                            ${nestedHTML}

                            <div
                                class="subtask-input-group"
                                style="margin-top:8px;"
                            >

                                <input

function addSubtask(todoId) {

    const typeSelect =
        document.getElementById(
            `subType-${todoId}`
        );

    const input =
        document.getElementById(
            `subInput-${todoId}`
        );

    const dateInput =
        document.getElementById(
            `subDate-${todoId}`
        );

    const subType =
        typeSelect
            ? typeSelect.value
            : 'simple';

    const text =
        input.value.trim();

    if (!text) return;

    const todo =
        todos.find(
            t => t.id === todoId
        );

    if (!todo) return;


    if (subType === 'list') {

        todo.subtasks.push({

            id:
                Date.now() +
                Math.floor(Math.random() * 1000),

            type: 'list',

            text,

            items: []

        });

    } else {

        todo.subtasks.push({

            id:
                Date.now() +
                Math.floor(Math.random() * 1000),

            type: 'simple',

            text,

            completed: false,

            dueDate:
                dateInput
                    ? (
                        dateInput.value ||
                        null
                    )
                    : null

        });

    }

    saveData();

    input.value = '';

    if (dateInput)
        dateInput.value = '';

    updateProgressUI(todoId);

    renderSubtasksUI(todoId);

}


function addNestedItem(
    todoId,
    subtaskId
) {

    const input =
        document.getElementById(
            `nestedInput-${todoId}-${subtaskId}`
        );

    if (!input) return;

    const text =
        input.value.trim();

    if (!text) return;

    const todo =
        todos.find(
            t => t.id === todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s => s.id === subtaskId
        );

    if (!subtask) return;

    if (!subtask.items)
        subtask.items = [];


    subtask.items.push({

        id:
            Date.now() +
            Math.floor(Math.random() * 1000),

        text,

        completed: false

    });


    saveData();

    input.value = '';

    updateProgressUI(todoId);

    renderSubtasksUI(todoId);

}

   체크
========================================================= */

function toggleSubtask(
    todoId,
    subtaskId
) {

    const todo =
        todos.find(
            t => t.id === todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s => s.id === subtaskId
        );

    if (!subtask) return;

    subtask.completed =
        !subtask.completed;

    saveData();

    updateProgressUI(todoId);

    renderSubtasksUI(todoId);

}


function toggleNestedItem(
    todoId,
    subtaskId,
    nestedId
) {

    const todo =
        todos.find(
            t => t.id === todoId
        );

    if (!todo) return;

    const subtask =
        todo.subtasks.find(
            s => s.id === subtaskId
        );

    if (!subtask || !subtask.items)
        return;

    const item =
        subtask.items.find(
            i => i.id === nestedId
        );

    if (!item) return;

    item.completed =
        !item.completed;

    saveData();

    updateProgressUI(todoId);

    renderSubtasksUI(todoId);

}

/* =========================================================
   스와이프
========================================================= */

function initSwipe(
    cardEl,
    id
) {

    let startX = 0;
    let currentX = 0;
    let isSwiping = false;


    const onStart = e => {

        startX =
            e.touches
                ? e.touches[0].clientX
                : e.clientX;

        isSwiping = true;

        cardEl.style.transition =
            'none';

    };


    const onMove = e => {

        if (!isSwiping) return;

        const x =
            e.touches
                ? e.touches[0].clientX
                : e.clientX;

        currentX =
            x - startX;

        if (currentX > 0) {

            cardEl.style.transform =
                `translateX(${currentX}px)`;

        }

    };


    const onEnd = () => {

        if (!isSwiping) return;

        isSwiping = false;

        cardEl.style.transition =
            'transform .25s ease';


        if (
            currentX >
            cardEl.offsetWidth * .4
        ) {

            cardEl.style.transform =
                `translateX(${cardEl.offsetWidth + 50}px)`;

            setTimeout(() => {

                todos =
                    todos.filter(
                        t => t.id !== id
                    );

                saveData();

                render();

            }, 200);

        } else {

            cardEl.style.transform =
                'translateX(0)';

        }

        currentX = 0;

    };


    cardEl.addEventListener(
        'touchstart',
        onStart
    );

    cardEl.addEventListener(
        'touchmove',
        onMove
    );

    cardEl.addEventListener(
        'touchend',
        onEnd
    );

}

function getCalendarEvents() {

    const events = [];

    const today =
        getTodayString();


    todos.forEach(todo => {

        if (todo.category === 'today') {

            events.push({

                id: todo.id,
                title: todo.title,
                date: today,
                type: 'today',
                completed: false,
                todoId: todo.id

            });

        }

        else if (todo.dueDate) {

            events.push({

                id: todo.id,
                title: todo.title,
                date: todo.dueDate,
                type: 'todo',
                completed: false,
                todoId: todo.id

            });

        }


        if (
            todo.type === 'project' &&
            todo.subtasks
        ) {

            todo.subtasks.forEach(sub => {

                if (
                    sub.type !== 'list' &&
                    sub.dueDate
                ) {

                    events.push({

                        id:
                            `sub-${todo.id}-${sub.id}`,

                        title:
                            sub.text,

                        date:
                            sub.dueDate,

                        type:
                            'subtask',

                        completed:
                            !!sub.completed,

                        todoId:
                            todo.id,

                        subtaskId:
                            sub.id

                    });

                }

            });

        }

    });


    return events;

}


/* =========================================================
   달력
========================================================= */

let calendarDate =
    new Date();

let selectedCalendarDate =
    getTodayString();


function openCalendar() {

    document.getElementById(
        'calendarModal'
    ).style.display = 'flex';

    calendarDate =
        new Date();

    selectedCalendarDate =
        getTodayString();

    renderCalendar();

}


function closeCalendar() {

    document.getElementById(
        'calendarModal'
    ).style.display = 'none';

}


function changeCalendarMonth(delta) {

    calendarDate.setMonth(
        calendarDate.getMonth() + delta
    );

    renderCalendar();

}


function renderCalendar() {

    const grid =
        document.getElementById(
            'calendarGrid'
        );

    const title =
        document.getElementById(
            'calendarTitle'
        );


    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();


    title.textContent =
        `${year}년 ${month + 1}월`;


    grid.innerHTML = '';


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const events =
        getCalendarEvents();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement('div');

        grid.appendChild(empty);

    }


    const today =
        getTodayString();


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const dateKey =
            `${year}-${String(
                month + 1
            ).padStart(2,'0')}-${String(
                day
            ).padStart(2,'0')}`;


        const cell =
            document.createElement('div');

        cell.className =
            'calendar-day';


        if (
            dateKey ===
            selectedCalendarDate
        ) {

            cell.classList.add(
                'selected'
            );

        }


        if (dateKey === today) {

            cell.classList.add(
                'today'
            );

        }


        const number =
            document.createElement('div');

        number.className =
            'calendar-number';

        number.textContent =
            day;

        cell.appendChild(number);


        const dayEvents =
            events.filter(
                e => e.date === dateKey
            );


        dayEvents
            .slice(0, 3)
            .forEach(event => {

                const badge =
                    document.createElement('div');

                badge.className =
                    'calendar-event';


                if (event.completed) {

                    badge.classList.add(
                        'completed'
                    );

                }


                if (
                    event.type === 'today'
                ) {

                    badge.classList.add(
                        'today-event'
                    );

                }


                badge.textContent =
                    event.type === 'today'
                        ? `☀️ ${event.title}`
                        : event.title;


                cell.appendChild(
                    badge
                );

            });


        if (
            dayEvents.length > 3
        ) {

            const more =
                document.createElement('div');

            more.style.fontSize =
                '.6rem';

            more.style.color =
                '#64748b';

            more.textContent =
                `+ ${dayEvents.length - 3}개`;

            cell.appendChild(
                more
            );

        }


        cell.onclick = () => {

            selectedCalendarDate =
                dateKey;

            renderCalendar();

        };


        grid.appendChild(cell);

    }


    showCalendarDetails(
        selectedCalendarDate
    );

}

/* =========================================================
   달력 이벤트 찾기
========================================================= */

function findCalendarEvent(
    eventId
) {

    const events =
        getCalendarEvents();

    return events.find(
        e =>
            String(e.id) ===
            String(eventId)
    );

}


/* =========================================================
   달력 완료
========================================================= */

function toggleCalendarEvent(
    eventId
) {

    const event =
        findCalendarEvent(eventId);

    if (!event) return;


    if (
        event.type === 'todo' ||
        event.type === 'today'
    ) {

        alert(
            '일반 할 일은 메인 화면에서 오른쪽으로 밀어 완료할 수 있어요.'
        );

        renderCalendar();

        return;

    }


    if (event.type === 'subtask') {

        const todo =
            todos.find(
                t => t.id === event.todoId
            );

        if (!todo) return;


        const sub =
            todo.subtasks.find(
                s => s.id === event.subtaskId
            );

        if (!sub) return;


        sub.completed =
            !sub.completed;


        saveData();

        render();

        renderCalendar();

    }

}


/* =========================================================
   달력 수정
========================================================= */

function editCalendarEvent(
    eventId
) {

    const event =
        findCalendarEvent(eventId);

    if (!event) return;


    if (
        event.type === 'todo' ||
        event.type === 'today'
    ) {

        openModal(
            event.todoId
        );

        return;

    }


    if (event.type === 'subtask') {

        openSubtaskEditModal(
            event.todoId,
            event.subtaskId
        );

    }

}


/* =========================================================
   달력 삭제
========================================================= */

function deleteCalendarEvent(
    eventId
) {

    const event =
        findCalendarEvent(eventId);

    if (!event) return;


    if (
        !confirm(
            `"${event.title}"을(를) 삭제할까요?`
        )
    ) return;


    if (
        event.type === 'todo' ||
        event.type === 'today'
    ) {

        todos =
            todos.filter(
                t => t.id !== event.todoId
            );

    }


    else if (
        event.type === 'subtask'
    ) {

        const todo =
            todos.find(
                t => t.id === event.todoId
            );

        if (todo) {

            todo.subtasks =
                todo.subtasks.filter(
                    s =>
                        s.id !==
                        event.subtaskId
                );

        }

    }


    saveData();

    render();

    renderCalendar();

}

                        item.style.color =
                            isPast
                                ? '#b91c1c'
                                : '#9f1239';


                        item.innerHTML =
                            `
                            📌 <strong>
                                ${escapeHTML(sub.text)}
                            </strong>

                            <span
                                style="
                                    font-size:.8rem;
                                    opacity:.85;
                                "
                            >
                                (
                                ${escapeHTML(todo.title)}
                                -
                                ${
                                    isPast
                                    ? '지남: '
                                    : ''
                                }
                                ${sub.dueDate}
                                )
                            </span>
                            `;


                        dueAlertList.appendChild(
                            item
                        );

                    }

                }
            );

        }


        const card =
            createCardElement(todo);


        if (
            todo.category === 'today'
        ) {

            todayTaskList.appendChild(
                card
            );

            todayTaskCount++;

        }

        else if (
            todo.category === 'commission'
        ) {

            commissionList.appendChild(
                card
            );

            commissionCount++;

        }

        else if (
            todo.category === 'homework'
        ) {

            homeworkList.appendChild(
                card
            );

            homeworkCount++;

        }

        else {

            todoList.appendChild(
                card
            );

        }

    });


    dueAlertSection.style.display =
        alertCount > 0
            ? 'block'
            : 'none';


    todayTaskSection.style.display =
        todayTaskCount > 0
            ? 'block'
            : 'none';


    commissionSection.style.display =
        commissionCount > 0
            ? 'block'
            : 'none';


    homeworkSection.style.display =
        homeworkCount > 0
            ? 'block'
            : 'none';


    mainSectionTitle.style.display =
        todoList.children.length > 0
            ? 'block'
            : 'none';

}


/* =========================================================
   시작
========================================================= */

render();

</script>

</body>
  </html>
